<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PlattsAI Archive</title>
<style>
:root{--bg:#f1f5f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--navy:#0f172a;--blue:#1d4ed8;--violet:#7c3aed}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}
header{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;padding:22px 16px 18px}.wrap{max-width:1040px;margin:auto}.header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{margin:0;font-size:clamp(20px,3vw,27px);letter-spacing:-.4px}.sub{margin-top:6px;color:#cbd5e1;font-size:12px;line-height:1.5}.admin-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:#1e3a5f;border:1px solid rgba(255,255,255,.6);padding:8px 12px;border-radius:9px;font-size:12px;font-weight:800}
main{padding:0 14px 32px}.topbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 10px}.tabs{display:inline-flex;gap:4px;background:#e2e8f0;padding:4px;border-radius:10px}.tab{border:0;background:transparent;color:#475569;font-weight:800;font-size:12px;padding:7px 11px;border-radius:7px;cursor:pointer}.tab.active{background:#fff;color:#0f172a;box-shadow:0 1px 3px rgba(15,23,42,.09)}
.search{display:flex;gap:8px;flex:1;min-width:260px}.search input,.search select{border:1px solid #cbd5e1;border-radius:9px;padding:9px 11px;background:#fff;color:#0f172a;outline:none}.search input{flex:1;min-width:160px}.status{font-size:11px;color:var(--muted);margin:8px 2px 14px}.month{background:#fff;border:1px solid var(--line);border-radius:13px;margin:12px 0;overflow:hidden;box-shadow:0 1px 3px rgba(15,23,42,.05)}.month h2{font-size:14px;margin:0;padding:12px 14px;background:#f8fafc;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:104px 86px 1fr 92px;gap:10px;align-items:center;padding:11px 14px;border-bottom:1px solid #f1f5f9}.row:last-child{border-bottom:0}.date{font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}.badge{display:inline-flex;justify-content:center;align-items:center;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;white-space:nowrap}.badge.daily{background:#dbeafe;color:#1d4ed8}.badge.special{background:#ede9fe;color:#6d28d9}.title{font-size:12px;color:#334155;line-height:1.45;overflow-wrap:anywhere}.filename{display:block;color:#94a3b8;font-size:9.5px;margin-top:2px}.open{display:inline-block;text-align:center;background:#1e40af;color:white;padding:7px 10px;border-radius:8px;font-size:11px;font-weight:800}.special-row .open{background:#6d28d9}.empty{background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:34px;text-align:center;color:#64748b;font-size:13px}
@media(max-width:700px){header{padding-top:18px}.row{grid-template-columns:82px 72px 1fr}.open{grid-column:1/-1;width:100%}.filename{display:none}.topbar{align-items:stretch}.tabs{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}.tab{text-align:center}.search{width:100%}}
</style>
</head>
<body>
<header><div class="wrap"><div class="header-row"><div><h1>📚 PlattsAI Archive</h1><div class="sub">데일리 시황과 기획 시황을 하나의 Google Sheet DB에서 관리합니다.</div></div><a class="admin-btn" href="https://script.google.com/macros/s/AKfycbxTrZ5IeWl8LkIvtfPYwFRmmsGGU4_WHw3p0O4NDT-AVwQKi0Zi5ckzWoRbXUlBzXJf/exec?page=admin" target="_blank" rel="noopener">🔐 관리자 업로드</a></div></div></header>
<main class="wrap">
<div class="topbar"><div class="tabs" id="tabs"><button class="tab active" data-type="all">전체</button><button class="tab" data-type="daily">데일리</button><button class="tab" data-type="special">기획 시황</button></div><div class="search"><input id="q" placeholder="날짜 또는 제목 검색"><select id="year"><option value="">전체 연도</option></select></div></div>
<div class="status" id="status">Google Sheet DB 조회 중...</div><div id="list"></div>
</main>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbxTrZ5IeWl8LkIvtfPYwFRmmsGGU4_WHw3p0O4NDT-AVwQKi0Zi5ckzWoRbXUlBzXJf/exec';
let REPORTS=[],TYPE='all';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const typeOf=r=>String(r.reportType||r.report_type||'daily').toLowerCase()==='special'?'special':'daily';
function targetUrl(r){return typeOf(r)==='special'?'special.html?id='+encodeURIComponent(r.reportId||r.report_id||''):'report.html?date='+encodeURIComponent(r.date||'')}
function groupMonth(rows){const o={};rows.forEach(r=>{const k=(r.date||'').slice(0,7)||'Unknown';(o[k]||(o[k]=[])).push(r)});return o}
function render(){const q=document.getElementById('q').value.trim().toLowerCase(),y=document.getElementById('year').value;let rows=REPORTS.filter(r=>{const t=typeOf(r);if(TYPE!=='all'&&t!==TYPE)return false;if(y&&!(r.date||'').startsWith(y+'-'))return false;const hay=((r.date||'')+' '+(r.title||'')+' '+(r.fileName||r.filename||'')).toLowerCase();return !q||hay.includes(q)});const root=document.getElementById('list');if(!rows.length){root.innerHTML='<div class="empty">조건에 맞는 리포트가 없습니다.</div>';return}const g=groupMonth(rows);root.innerHTML=Object.keys(g).sort().reverse().map(m=>'<section class="month"><h2>'+esc(m)+'</h2>'+g[m].sort((a,b)=>String(b.date).localeCompare(String(a.date))||String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))).map(r=>{const t=typeOf(r),label=t==='special'?'기획':'데일리',fn=r.fileName||r.filename||'';return '<div class="row '+(t==='special'?'special-row':'')+'"><div class="date">'+esc(r.date)+'</div><div><span class="badge '+t+'">'+label+'</span></div><div class="title">'+esc(r.title||(t==='special'?'기획 시황':'Platts Daily Report'))+(fn?'<span class="filename">'+esc(fn)+'</span>':'')+'</div><a class="open" href="'+esc(targetUrl(r))+'">리포트 보기</a></div>'}).join('')+'</section>').join('')}
async function load(){try{const res=await fetch(GAS_URL+'?action=listReports&limit=500&_='+Date.now(),{cache:'no-store',redirect:'follow'});if(!res.ok)throw new Error('HTTP '+res.status);const data=await res.json();if(!data.ok)throw new Error(data.error||'API error');REPORTS=data.reports||[];const years=[...new Set(REPORTS.map(r=>(r.date||'').slice(0,4)).filter(Boolean))].sort().reverse();const sel=document.getElementById('year');years.forEach(y=>sel.insertAdjacentHTML('beforeend','<option value="'+esc(y)+'">'+esc(y)+'</option>'));const dc=REPORTS.filter(r=>typeOf(r)==='daily').length,sc=REPORTS.filter(r=>typeOf(r)==='special').length;document.getElementById('status').textContent='총 '+REPORTS.length+'개 · 데일리 '+dc+' · 기획 '+sc+' · Google Sheet DB 연결';render()}catch(e){document.getElementById('status').textContent='DB 조회 실패: '+e.message;document.getElementById('list').innerHTML='<div class="empty">Google Apps Script 연결을 확인해 주세요.</div>'}}
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(!b)return;TYPE=b.dataset.type;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('q').addEventListener('input',render);document.getElementById('year').addEventListener('change',render);load();
</script>
</body></html>
