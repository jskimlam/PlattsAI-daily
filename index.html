<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PlattsAI Archive</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}header{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;padding:22px 16px}.wrap{max-width:1040px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{margin:0;font-size:clamp(19px,3vw,26px)}.sub{font-size:12px;color:#cbd5e1;margin-top:7px}.admin{background:#fff;color:#1e3a5f;border-radius:9px;padding:9px 13px;font-size:12px;font-weight:800}main{padding:0 14px 30px}.bar{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.tabs{display:flex;gap:4px;background:#e2e8f0;border-radius:9px;padding:4px}.tab{border:0;border-radius:7px;padding:8px 12px;font-size:12px;font-weight:800;background:transparent;cursor:pointer;color:#475569}.tab.active{background:#fff;color:#0f172a}.search{flex:1;display:flex;gap:7px}.search input,.search select{border:1px solid #cbd5e1;border-radius:8px;padding:9px;background:#fff;min-width:0}.search input{flex:1}.status{font-size:11px;color:#64748b;margin:8px 0 12px}.month{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin:12px 0;overflow:hidden}.month h2{font-size:14px;margin:0;padding:12px;background:#f8fafc}.row{display:grid;grid-template-columns:100px 75px 1fr auto;gap:10px;align-items:center;border-top:1px solid #f1f5f9;padding:12px}.date{font-size:12px;font-weight:800}.badge{font-size:10px;font-weight:800;border-radius:20px;padding:4px 7px;text-align:center;background:#dbeafe;color:#1d4ed8}.badge.special{background:#ede9fe;color:#6d28d9}.name{font-size:12px;line-height:1.5;overflow-wrap:anywhere}.filename{font-size:10px;color:#94a3b8}.open{background:#1e40af;color:#fff;border-radius:7px;padding:8px 11px;font-size:11px;font-weight:800}.row.special .open{background:#6d28d9}.empty{padding:34px;text-align:center;color:#64748b;background:white;border-radius:12px}@media(max-width:620px){.tabs,.search{width:100%}.tabs{display:grid;grid-template-columns:repeat(3,1fr)}.row{grid-template-columns:82px 66px 1fr}.open{grid-column:1/-1;text-align:center}.filename{display:none}}</style></head><body><header><div class="wrap head"><div><h1>📚 PlattsAI Archive</h1><div class="sub">데일리 원본 HTML · 기획 시황 · 가격 이력 DB</div></div><a class="admin" href="https://script.google.com/macros/s/AKfycbygIHKgqSHk9WdaYK3TG2BO_p0S2PwZgByUdDFrcDdTkVOQ9NQPhC8saF4pj1ENAH6H/exec?page=admin" target="_blank" rel="noopener">🔐 관리자 업로드</a></div></header><main class="wrap"><div class="bar"><div class="tabs" id="tabs"><button class="tab active" data-type="all">전체</button><button class="tab" data-type="daily">데일리</button><button class="tab" data-type="special">기획 시황</button></div><div class="search"><input id="q" placeholder="날짜·제목 검색"><select id="year"><option value="">전체 연도</option></select></div></div><div class="status" id="status">DB 불러오는 중…</div><div id="list"></div></main><script>
(function(){const GAS='https://script.google.com/macros/s/AKfycbygIHKgqSHk9WdaYK3TG2BO_p0S2PwZgByUdDFrcDdTkVOQ9NQPhC8saF4pj1ENAH6H/exec',E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let reports=[],type='all';const $=id=>document.getElementById(id),T=r=>String(r.reportType||r.report_type||'daily').toLowerCase()==='special'?'special':'daily';function render(){let q=$('q').value.toLowerCase().trim(),year=$('year').value;let rows=reports.filter(r=>(type==='all'||T(r)===type)&&(!year||String(r.date).startsWith(year))&&(!q||[r.date,r.title,r.fileName||r.filename].join(' ').toLowerCase().includes(q)));let months={};rows.forEach(r=>{let m=String(r.date||'').slice(0,7)||'날짜 미상';(months[m]||(months[m]=[])).push(r)});$('list').innerHTML=rows.length?Object.keys(months).sort().reverse().map(m=>'<section class="month"><h2>'+E(m)+'</h2>'+months[m].sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(r=>{let t=T(r),url=t==='special'?'special.html?id='+encodeURIComponent(r.reportId||r.report_id||''):'report.html?date='+encodeURIComponent(r.date||'');return '<div class="row '+t+'"><div class="date">'+E(r.date)+'</div><span class="badge '+t+'">'+(t==='special'?'기획':'데일리')+'</span><div class="name">'+E(r.title||'PlattsAI Report')+'<div class="filename">'+E(r.fileName||r.filename||'')+'</div></div><a class="open" href="'+E(url)+'">리포트 보기</a></div>'}).join('')+'</section>').join(''):'<div class="empty">조건에 맞는 리포트가 없습니다.</div>'}async function load(){try{let r=await fetch(GAS+'?action=listReports&limit=500&_='+Date.now(),{cache:'no-store',redirect:'follow'});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();if(!j.ok)throw Error(j.error||'API 오류');reports=j.reports||[];let ys=[...new Set(reports.map(r=>String(r.date||'').slice(0,4)).filter(Boolean))].sort().reverse();$('year').innerHTML='<option value="">전체 연도</option>'+ys.map(y=>'<option value="'+E(y)+'">'+E(y)+'</option>').join('');$('status').textContent='총 '+reports.length+'건 · 데일리 '+reports.filter(r=>T(r)==='daily').length+'건 · 기획 '+reports.filter(r=>T(r)==='special').length+'건';render()}catch(e){$('status').textContent='DB 연결 오류: '+e.message;$('list').innerHTML='<div class="empty">새 GAS 배포의 접근 권한과 URL을 확인해 주세요.</div>'}}$('tabs').onclick=e=>{let b=e.target.closest('.tab');if(!b)return;type=b.dataset.type;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()};$('q').oninput=render;$('year').onchange=render;load()})();
</script></body></html>
