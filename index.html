<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PlattsAI Archive</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{text-decoration:none;color:inherit}
header{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;padding:22px 16px}.wrap{max-width:1040px;margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}h1{margin:0;font-size:clamp(19px,3vw,26px)}.sub{font-size:12px;color:#cbd5e1;margin-top:7px}.head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.admin{background:#fff;color:#1e3a5f;border:0;border-radius:9px;padding:9px 13px;font-size:12px;font-weight:800;cursor:pointer}.refresh{background:#1e293b;color:#fff;border:1px solid #64748b;border-radius:9px;padding:9px 13px;font-size:12px;font-weight:800;cursor:pointer}main{padding:0 14px 30px}.bar{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}.tabs{display:flex;gap:4px;background:#e2e8f0;border-radius:9px;padding:4px}.tab{border:0;border-radius:7px;padding:8px 12px;font-size:12px;font-weight:800;background:transparent;cursor:pointer;color:#475569}.tab.active{background:#fff;color:#0f172a}.search{flex:1;display:flex;gap:7px}.search input,.search select{border:1px solid #cbd5e1;border-radius:8px;padding:9px;background:#fff;min-width:0}.search input{flex:1}.status{font-size:11px;color:#64748b;margin:8px 0 12px}.month{background:#fff;border:1px solid #e2e8f0;border-radius:12px;margin:12px 0;overflow:hidden}.month h2{font-size:14px;margin:0;padding:12px;background:#f8fafc}.row{display:grid;grid-template-columns:110px 75px 1fr auto;gap:10px;align-items:center;border-top:1px solid #f1f5f9;padding:12px}.date{font-size:12px;font-weight:800}.period{font-size:10px;font-weight:500;color:#64748b;margin-top:3px}.badge{font-size:10px;font-weight:800;border-radius:20px;padding:4px 7px;text-align:center;background:#dbeafe;color:#1d4ed8}.badge.special{background:#ede9fe;color:#6d28d9}.badge.weekly{background:#dcfce7;color:#166534}.name{font-size:12px;line-height:1.5;overflow-wrap:anywhere}.filename{font-size:10px;color:#94a3b8}.actions{display:flex;gap:6px;align-items:center}.open,.download{border:0;border-radius:7px;padding:8px 11px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}.open{background:#1e40af;color:#fff}.download{background:#e2e8f0;color:#334155}.row.special .open{background:#6d28d9}.row.weekly .open{background:#166534}.empty{padding:34px;text-align:center;color:#64748b;background:white;border-radius:12px}
@media(max-width:620px){.tabs,.search{width:100%}.tabs{display:grid;grid-template-columns:repeat(4,1fr)}.tab{padding:8px 3px}.row{grid-template-columns:90px 66px 1fr}.actions{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.open,.download{text-align:center}.filename{display:none}}
</style></head><body><header><div class="wrap head"><div><h1>📚 PlattsAI Archive</h1><div class="sub">데일리 · 위클리 · 기획 시황 원본 HTML 및 가격 이력</div></div><div class="head-actions"><button class="refresh" id="refresh" type="button">↻ 새로고침</button><a class="admin" href="https://script.google.com/macros/s/AKfycbwak8tk4J1wWxEo6ksXjYEIXbqe34JkqqE9EbMCHey72-aR4J5LNZ7YLHdihUEgQaFI/exec?page=admin" target="_blank" rel="noopener">🔐 관리자 업로드</a></div></div></header>
<main class="wrap"><div class="bar"><div class="tabs" id="tabs"><button class="tab active" data-type="all">전체</button><button class="tab" data-type="daily">데일리</button><button class="tab" data-type="weekly">위클리</button><button class="tab" data-type="special">기획 시황</button></div><div class="search"><input id="q" placeholder="날짜·제목 검색"><select id="year"><option value="">전체 연도</option></select></div></div><div class="status" id="status">DB 불러오는 중…</div><div id="list"></div></main>
<script>
(function(){'use strict';const GAS='https://script.google.com/macros/s/AKfycbwak8tk4J1wWxEo6ksXjYEIXbqe34JkqqE9EbMCHey72-aR4J5LNZ7YLHdihUEgQaFI/exec';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=id=>document.getElementById(id);let reports=[],type='all';function reportType(r){let t=String(r.reportType||r.report_type||'daily').toLowerCase();return t==='weekly'||t==='special'?t:'daily'}function monday(date){let d=new Date(date+'T00:00:00Z');if(!Number.isFinite(d.getTime()))return '';d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.toISOString().slice(0,10)}function isoWeek(date){let d=new Date(date+'T00:00:00Z');if(!Number.isFinite(d.getTime()))return '';d.setUTCDate(d.getUTCDate()+4-(d.getUTCDay()||7));const y=d.getUTCFullYear(),start=new Date(Date.UTC(y,0,1));return Math.ceil(((d-start)/86400000+1)/7)}function reportUrl(r,t){if(t==='daily')return 'report.html?date='+encodeURIComponent(r.date||'');if(t==='weekly')return 'weekly.html?id='+encodeURIComponent(r.reportId||r.report_id||'W-'+String(r.date||'').replace(/-/g,''));return 'special.html?id='+encodeURIComponent(r.reportId||r.report_id||'')}
function weeklyRegion(r){let id=String(r.reportId||r.report_id||'').toUpperCase(),fn=String(r.fileName||r.filename||'').toUpperCase();if(/^W-EU-/.test(id)||/_W_EU_/.test(fn)||/_EU_/.test(fn))return'EU';if(/^W-US-/.test(id)||/_W_US_/.test(fn)||/_US_/.test(fn))return'US';return'ASIA'}
function displayTitle(r){let t=reportType(r);if(t!=='weekly')return r.title||'PlattsAI Report';let region=weeklyRegion(r);return region==='EU'?'유럽 석유화학 원료 위클리 시황':region==='US'?'미국 석유화학 원료 위클리 시황':'아시아 석유화학 원료 위클리 시황'}
function render(){let q=$('q').value.toLowerCase().trim(),year=$('year').value;let rows=reports.filter(r=>(type==='all'||reportType(r)===type)&&(!year||String(r.date).startsWith(year))&&(!q||[r.date,displayTitle(r),r.title,r.fileName||r.filename].join(' ').toLowerCase().includes(q)));let months={};rows.forEach(r=>{let m=String(r.date||'').slice(0,7)||'날짜 미상';(months[m]||(months[m]=[])).push(r)});$('list').innerHTML=rows.length?Object.keys(months).sort().reverse().map(m=>'<section class="month"><h2>'+esc(m)+'</h2>'+months[m].sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(r=>{let t=reportType(r),url=reportUrl(r,t),week=t==='weekly'?'W'+isoWeek(r.date):'',period=t==='weekly'?(r.weekStart||monday(r.date))+' ~ '+r.date:'';return '<div class="row '+t+'"><div class="date">'+esc(t==='weekly'?week:r.date)+'<div class="period">'+esc(period)+'</div></div><span class="badge '+t+'">'+(t==='weekly'?'위클리':t==='special'?'기획':'데일리')+'</span><div class="name">'+esc(displayTitle(r))+'<div class="filename">'+esc(r.fileName||r.filename||'')+'</div></div><div class="actions"><a class="open" href="'+esc(url)+'">리포트 보기</a><button class="download" type="button" data-type="'+esc(t)+'" data-date="'+esc(r.date||'')+'" data-id="'+esc(r.reportId||r.report_id||'')+'" data-filename="'+esc(r.fileName||r.filename||'')+'">HTML 다운로드</button></div></div>'}).join('')+'</section>').join(''):'<div class="empty">조건에 맞는 리포트가 없습니다.</div>'}
function safeName(s){return String(s||'').replace(/[\\/:*?"<>|]/g,'_')}function weeklyFallback(id,date){let m=/^W-(?:(EU|US)-)?(\d{8})$/i.exec(id||'');if(m)return 'plattsAI_W_'+(m[1]?m[1].toUpperCase()+'_':'')+m[2]+'.html';return 'plattsAI_W_'+String(date||'').replace(/-/g,'')+'.html'}async function downloadReport(btn){let t=btn.dataset.type||'daily',date=btn.dataset.date||'',id=btn.dataset.id||'',filename=btn.dataset.filename||'';let u=t==='daily'?GAS+'?action=getDailyReportHtml&date='+encodeURIComponent(date):GAS+'?action=getSpecialReport&id='+encodeURIComponent(id);btn.disabled=true;let old=btn.textContent;btn.textContent='받는 중…';try{let r=await fetch(u+'&_='+Date.now(),{cache:'no-store',redirect:'follow'});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();if(!j.ok)throw Error(j.error||'API 오류');if(!j.found||typeof j.html!=='string'||!j.html.trim())throw Error('저장된 원본 HTML이 없습니다.');if(!filename){if(t==='daily')filename='plattsAI_'+date.replace(/-/g,'')+'.html';else if(t==='weekly')filename=weeklyFallback(id,date);else filename='plattsAI_S_'+date.replace(/-/g,'')+'_report.html'}let blob=new Blob([j.html],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=safeName(filename);document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}catch(e){alert('HTML 다운로드 실패: '+e.message)}finally{btn.disabled=false;btn.textContent=old}}async function load(){try{let r=await fetch(GAS+'?action=listReports&limit=500&_='+Date.now(),{cache:'no-store',redirect:'follow'});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();if(!j.ok)throw Error(j.error||'API 오류');reports=j.reports||[];let ys=[...new Set(reports.map(r=>String(r.date||'').slice(0,4)).filter(Boolean))].sort().reverse();$('year').innerHTML='<option value="">전체 연도</option>'+ys.map(y=>'<option value="'+esc(y)+'">'+esc(y)+'</option>').join('');$('status').textContent='총 '+reports.length+'건 · 데일리 '+reports.filter(r=>reportType(r)==='daily').length+'건 · 위클리 '+reports.filter(r=>reportType(r)==='weekly').length+'건 · 기획 '+reports.filter(r=>reportType(r)==='special').length+'건';render()}catch(e){$('status').textContent='DB 연결 오류: '+e.message;$('list').innerHTML='<div class="empty">GAS 배포 URL과 접근 권한을 확인해 주세요.</div>'}}$('tabs').onclick=e=>{let b=e.target.closest('.tab');if(!b)return;type=b.dataset.type;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()};$('list').onclick=e=>{let b=e.target.closest('button.download');if(b)downloadReport(b)};$('q').oninput=render;$('year').onchange=render;$('refresh').onclick=()=>load();load()})();
</script></body></html>
