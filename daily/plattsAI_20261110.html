<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#dbe3ed;--up:#dc2626;--down:#2563eb;--flat:#94a3b8}
*{box-sizing:border-box}
html,body{margin:0;background:#edf3f9;color:var(--ink);font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:clamp(13px,1.15vw,16px)}
button{font:inherit;cursor:pointer}
#hdr{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;padding:25px max(20px,calc((100vw - 1180px)/2))}
.hin{display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}
#h-title{font-size:clamp(23px,3vw,36px);font-weight:800;margin:0}
#h-sub{opacity:.83;margin:8px 0 0;font-size:clamp(12px,1vw,15px)}
.hact{display:flex;gap:7px;flex-wrap:wrap}
.hbtn{border:1px solid #91a7c0;border-radius:8px;background:#ffffff18;color:#fff;padding:8px 11px}

.page{max-width:1220px;margin:auto;padding:18px 20px 45px}
.sec{background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 3px 15px #0f172a0a;padding:19px;margin-bottom:17px}
.lab{font-size:.76em;font-weight:800;letter-spacing:.1em;color:#2563eb}
.stitle{font-size:clamp(19px,1.9vw,25px);margin:6px 0 16px}
.grid{display:grid;gap:10px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{border:1px solid var(--line);border-radius:9px;background:#fff;padding:12px;min-width:0}

.kt{font-weight:750;font-size:.9em}
.kv{font-size:clamp(19px,2vw,27px);font-weight:800;margin:7px 0 2px}
.meta{font-size:.82em;color:var(--muted);line-height:1.48}
.up{color:var(--up);font-weight:750}.down{color:var(--down);font-weight:750}.flat{color:var(--flat);font-weight:750}
.pill{display:inline-block;border:1px solid currentColor;border-radius:999px;padding:1px 9px;font-size:.8em;font-weight:800;margin-left:7px;white-space:nowrap;background:#fff}
.pill.big{margin-left:0;font-size:.95em;padding:3px 12px}
.sub{font-size:1em;margin:18px 0 8px;color:#1e3a5f}
.sc{border-top:3px solid var(--sc)}
.fh{display:flex;align-items:center;gap:9px;margin:8px 0 2px}
.chg{font-size:.9em}
.rng{font-weight:800;margin:6px 0 2px}

.dt{display:inline-block;background:#fef3c7;color:#92400e;border:1px solid #fcd34d;border-radius:5px;padding:1px 6px;font-size:.78em;font-weight:800;margin-left:5px;white-space:nowrap}
.dt.rl{background:#e0f2fe;color:#075985;border-color:#7dd3fc}
.twrap{overflow-x:auto;margin-top:15px}
table{width:100%;border-collapse:collapse;min-width:800px;font-size:.87em}
th,td{border-bottom:1px solid var(--line);padding:9px 7px;text-align:left;white-space:nowrap}
th{background:#f1f5f9;color:#334155}
.note{margin:10px 0 0;font-size:.84em;color:#475569;line-height:1.55}
.summary,.ai{background:#f0f9ff;border:1px solid #bae6fd;border-radius:9px;padding:14px;line-height:1.65;margin:14px 0}
.summary b{display:block;color:#0369a1}
.pc{padding:10px 0;border-top:1px solid var(--line)}
.pct{font-weight:800}
.pc p,.card p{margin:5px 0 0;line-height:1.55}
.pc p.aij{margin:7px 0 0;padding:8px 11px;border-left:3px solid #6366f1;background:#eef2ff;border-radius:0 7px 7px 0}
.aij .tag{background:#c7d2fe;color:#3730a3;margin-right:7px}
.fc{border-top:3px solid #0ea5e9}
.card ul{padding-left:19px;margin:6px 0 0;line-height:1.48}
.infos{display:grid;gap:8px}
.info{background:#f8fafc}
.tag{display:inline-block;background:#e2e8f0;border-radius:5px;padding:2px 6px;font-size:.77em;font-weight:800;margin-right:6px}
.flag{background:#fff7ed;border:1px solid #fed7aa;border-radius:9px;padding:13px;margin:13px 0;line-height:1.6}
.exec{background:#0f172a;color:#f8fafc;border-radius:9px;padding:14px}
.exec div{padding:5px 0;line-height:1.5}
#src{margin-top:16px;border-top:1px solid var(--line);background:#f8fafc;padding:12px 4px;font-size:.78em;line-height:1.7;color:#475569}
@media(max-width:800px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}}
@media(max-width:600px){.g2{grid-template-columns:1fr}}
@page{size:A4;margin:12mm 14mm}
@media print{
#hdr .hact{display:none!important}
#hdr{padding:10pt 14pt}
html,body{background:#fff!important;font-size:11pt}
.page{padding:0}
.lab,.stitle{break-after:avoid-page}
.stitle+*{break-before:avoid-page}
.sec{box-shadow:none!important;border:1px solid #d1d5db!important;padding:10pt 12pt!important;margin-bottom:10pt!important}
.twrap{overflow:visible}table{min-width:0;font-size:8pt}thead{display:table-header-group}tr,.card,.pc,.flag,.ai{break-inside:avoid-page}
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

var T={"ko": {"summary": "브렌트와 WTI는 전일 대비 각각 1.08달러, 0.81달러 하락했고 두바이는 직전 발표일 대비 8.48달러 하락. 나프타는 68달러, 벤젠은 98.33달러, 스티렌은 81달러 하락하며 원료에서 방향족 제품으로 약세 확산. 프로필렌·부타디엔·PP도 하락한 반면 에틸렌과 주간 아크릴로니트릴은 보합. 이달 초 반등이 있었으나 최근 원유와 방향족 제품의 하락 흐름이 재개된 상태. 종합적으로 지정학적 위험 프리미엄 축소와 구매 관망이 가격을 압박하되, 에틸렌·부타디엔·아크릴로니트릴의 제한된 현물 공급이 하락 속도를 늦추는 구도.", "pc": {"brent": "1월물 브렌트는 91.49달러/배럴로 전일보다 1.08달러 하락. 미국 대통령이 이란에 대한 추가 공격 가능성을 낮게 언급한 뒤 긴장 완화 기대가 커진 것이 마감 약세의 직접 배경. 11월 6일 반등 이후 9일과 10일 연속 하락. 아시아 장중의 더 큰 낙폭과 최종 정산가의 전일 대비 낙폭은 관측 시점이 서로 다른 가격임. 원유 약세는 나프타와 방향족 제품의 원가 지지 약화로 연결.", "wti": "12월물 WTI는 86.04달러/배럴로 전일보다 0.81달러 하락. 같은 날 원유 선물 마감 시황은 미국·이란 간 긴장 완화 기대를 하락 배경으로 제시. 11월 6일 90.83달러에서 9일 86.85달러로 내려온 뒤 약세 지속. 브렌트와 함께 하락했지만 이날 전일 대비 낙폭은 브렌트보다 작았음. 석유화학 원료의 방향 판단에는 국제 원유 약세를 보여주는 병행 지표.", "dubai": "두바이 근월물 절대가격은 87.82달러/배럴로 11월 6일보다 8.48달러 하락. 중동 원유 시황은 추가 군사공격 보류 관련 소식 이후 현물 가격과 스프레드가 함께 급락했다고 설명. 현물 두바이의 같은 달 선물 대비 프리미엄도 25센트/배럴로 축소됐으나 이는 절대가격과 별개의 수치. 11월 5일 하락 뒤 6일 반등했던 가격이 다시 낮아진 흐름. 아시아 나프타의 원가 환경에도 하방 압력.", "naph": "일본 도착 나프타는 860.25달러/톤으로 직전 발표일보다 68달러 하락. 당일 시황은 중동 긴장 완화 기대와 운임 하락, 12월 상반기 인도분의 제한적인 현물 수요를 현금 프리미엄의 압박 요인으로 제시. 미쓰이화학의 오사카행 12월 하반기 인도 나프타 2만5000톤 구매도 전해져 공급 긴축과 구매 부재가 시장 전반에 동일하게 적용되지는 않는 모습. 11월 5일 급락과 6일 반등을 거쳐 기준일 다시 하락. 나프타 하락은 크래커 원가를 낮추지만 에틸렌 가격에는 즉각 반영되지 않은 상태.", "ethylene": "동북아 도착 에틸렌은 1240달러/톤으로 직전 발표일과 동일. 12월 인도 3500톤 화물의 매도 의향은 1290달러/톤, 동북아의 거래 가능 가격은 1240달러/톤으로 전해져 매수·매도 간극이 유지. 당일 시황은 나프타 약세에 따른 구매 관망과 제한된 현물 공급을 보합의 병행 요인으로 설명. 11월 4일 10달러 상승한 뒤 5일, 6일, 10일 연속 같은 가격. 나프타 비용 하락에도 원료와 에틸렌의 가격 전이가 지연된 구간.", "propylene": "중국 도착 중합용 프로필렌은 1370달러/톤으로 직전 발표일보다 30달러 하락. 당일 시황은 원유 하락을 직접 원인으로 지목하고 산둥성 일부 프로판 탈수소 설비의 재가동에 따른 국내 공급 증가도 전함. 산둥성 가격은 직전 발표일보다 300위안/톤 낮은 1만1100위안/톤으로 평가. 11월 초 1420달러/톤 수준을 유지하던 가격은 6일과 10일 연속 하락. 하류 PP의 매수 심리에도 부담이 되는 변화.", "benz": "한국 선적 벤젠은 937달러/톤으로 직전 발표일보다 98.33달러 하락. 당일 시황은 원유와 선물시장의 동반 약세를 하락 요인으로 지목하며, 센탈리온이 GS칼텍스에 12월 선적분을 944달러/톤에 판 거래를 기록. 중국 벤젠 선물도 하락했고 시노펙은 화동 지역 고시가격을 300위안/톤 인하. 11월 5일까지 이어진 하락이 6일 소폭 반등한 뒤 다시 심화. 벤젠 약세는 스티렌의 원가 지지를 낮추는 요인.", "sm": "중국 도착 스티렌은 1169달러/톤으로 직전 발표일보다 81달러 하락. 당일 시황은 원유와 벤젠 약세로 원가 지지가 줄어든 점을 직접 원인으로 설명. 화동 지역 항구 재고는 11월 9일 3만7600톤으로 전주보다 6900톤 증가했고, 중국 PS 생산자는 낮춘 오퍼에도 구매자가 추가 하락을 기다린다고 전함. 11월 초부터 이어진 하락이 6일 보합 후 재개된 흐름. 하류 PS의 가격 협상에는 원가 하락과 구매 관망이 동시에 작용.", "bd": "중국 도착 부타디엔은 1830달러/톤으로 직전 발표일보다 10달러 하락. 당일 시황은 원유·나프타와 중국 합성고무 선물 약세를 하락 배경으로 제시. 반면 한국 판매자는 12월 현물 판매 가능 물량이 매우 제한적이라며 1870달러/톤의 매도 의향을 제시. 11월 초 1880달러/톤에서 5일, 6일, 10일 순차적으로 하락했으나 낙폭은 나프타보다 작음. 합성고무 가격 약세와 제한된 부타디엔 공급이 하류 수요 판단에서 엇갈리는 신호.", "pp": "극동아시아 도착 PP 라피아는 1330달러/톤으로 직전 발표일보다 20달러 하락. 11월 4일에는 높은 프로필렌 원가와 공급 제약 속에 1370달러/톤까지 올랐으나 이후 평가가격이 하락. 주간 시장 자료는 중국과 동남아 구매자들이 가격 하락을 예상해 구매량을 줄였다고 전함. 공급 측면에서는 높은 프로판 가격에 따른 중국 프로판 탈수소 설비의 낮은 가동 유인이 앞서 지목된 상태. 프로필렌 가격도 기준일 하락해 PP의 원가 지지가 약화된 흐름.", "an": "극동아시아 도착 주간 아크릴로니트릴은 1800달러/톤으로 11월 3일 발표값과 동일. 11월 10일 아크릴로니트릴 시황은 중국 가격이 프로필렌 하락을 따라 약해진 반면 극동아시아 가격은 제한된 공급에 지지됐다고 설명. 한국 생산자들은 높은 원가와 제한된 현물 오퍼를 이유로 매도 수준을 유지. 11월 3일에는 프로필렌·암모니아 강세를 배경으로 직전 주보다 190달러 상승한 바 있음. 이번 주에는 상류 프로필렌 약세가 나타났지만 극동아시아 도착 가격에는 반영되지 않은 모습."}, "pj": {"brent": "추가 공격 위험의 축소가 최근 하락의 주된 원인으로 판단. 단기 약세에 무게를 두되 원유 연동 구매는 분할 진행이 적절.", "wti": "브렌트와 공통인 지정학적 위험 프리미엄 축소가 우세. 다음 가격 방향은 하락으로 판단하며 급한 물량 외 선구매는 축소가 적절.", "dubai": "중동 원유의 위험 프리미엄 축소가 절대가격 하락을 주도한 것으로 판단. 단기 하락에 무게를 두고 원가 연동 계약은 가격 재협상이 유리.", "naph": "원유 약세와 현물 구매 관망이 공급 긴축보다 가격에 더 크게 반영된 것으로 판단. 단기 하락을 예상하며 필수 물량부터 나눠 구매가 적절.", "ethylene": "제한된 현물 공급이 나프타 하락의 전이를 막는 힘으로 판단. 단기 보합에 무게를 두고 확정 수요분 위주의 구매가 적절.", "propylene": "원유 하락에 산둥성 공급 회복이 겹친 점이 핵심. 단기 하락을 예상하며 신규 구매의 가격 협상력이 개선되는 국면.", "benz": "원유·선물 약세가 주도하고 구매 관망이 하락을 강화한 것으로 판단. 단기 하락에 무게를 두되 급락 후 필요한 물량은 분할 매입이 적절.", "sm": "원유와 벤젠의 원가 지지 약화가 가장 유력한 주된 원인. 재고 증가와 하류 관망까지 겹쳐 단기 하락에 무게를 둔 구매 지연이 유리.", "bd": "상류·합성고무 약세가 하락 방향을 만들었으나 제한된 현물 공급이 낙폭을 억제한 것으로 판단. 단기는 보합에 무게를 두고 확정 생산분만 확보가 적절.", "pp": "하락하는 원유·프로필렌과 구매자 관망이 기존 공급 제약보다 우세해진 것으로 판단. 단기 하락에 무게를 두고 구매 가격의 재협상이 유리.", "an": "극동아시아의 제한된 현물 공급과 높은 판매 의향이 프로필렌 약세를 상쇄한 것으로 판단. 단기 보합에 무게를 두고 계약 필요량 중심의 조달이 적절."}, "factors": [{"title": "매크로 · 원유 위험 프리미엄", "body": "11월 10일 브렌트와 WTI는 모두 하락 마감. 원유 마감 시황은 미국의 추가 대이란 공격 가능성이 낮아졌다는 발언과 긴장 완화 기대를 배경으로 제시. 11월 9일의 큰 낙폭에 이어 약세가 지속. 원유 연동 원료의 가격 지지가 약해지는 방향으로 해석."}, {"title": "매크로 · 두바이 가격", "body": "두바이 절대가격은 11월 6일 대비 8.48달러 하락. 같은 기간 현물과 선물의 가격차도 축소. 6일 반등에서 기준일 하락으로 흐름이 바뀐 상태. 아시아 원료 가격의 약세를 뒷받침하는 신호로 해석."}, {"title": "수요 · 나프타 현물", "body": "12월 상반기 인도분의 제한적인 구매 관심이 나프타 현금 프리미엄의 압박 요인으로 거론. 반면 미쓰이화학의 12월 하반기 인도분 구매 사례도 존재. 앞서 11월 초에는 공급 긴축이 나프타 시장을 지지. 수요의 시점 차이 때문에 절대가격 하락과 현물 공급 긴축이 공존하는 상태로 해석."}, {"title": "공급 · 에틸렌", "body": "동북아 현물 공급이 제한된 가운데 12월 화물의 매도 의향은 거래 가능 가격보다 높았음. 나프타는 기준일 크게 하락했으나 에틸렌은 보합. 11월 4일 상승 이후 같은 가격이 유지된 흐름. 공급 제약이 단기 원가 하락의 전이를 지연시키는 것으로 해석."}, {"title": "공급 · 프로필렌", "body": "산둥성 일부 프로판 탈수소 설비의 재가동으로 중국 내 공급이 증가했다는 보도. 프로필렌 중국 도착 가격은 직전 발표일보다 30달러 하락. 11월 초의 공급 긴축에 따른 고가격에서 방향이 바뀐 모습. 공급 회복이 원유 약세의 가격 영향을 키우는 것으로 해석."}, {"title": "수요 · 방향족과 수지", "body": "벤젠은 중국 선물 약세와 하류의 연말 수요 둔화 속에 하락. 스티렌도 원가 지지가 약해진 가운데 PS 생산자는 인하한 오퍼에 구매 반응이 약하다고 설명. 11월 6일의 일시적 보합·반등 뒤 두 품목 모두 다시 하락. 하류 관망이 원료 가격 하락을 제품 가격으로 전달하는 힘을 키우는 것으로 해석."}, {"title": "공급 · 부타디엔과 아크릴로니트릴", "body": "부타디엔 판매자는 12월 현물 물량의 제한을 언급했고 극동아시아 아크릴로니트릴도 공급 긴축에 지지. 한편 부타디엔의 합성고무 선물과 아크릴로니트릴의 원료 프로필렌은 약세. 전주 강세 이후 두 품목의 기준일 가격 변화는 각각 소폭 하락과 보합. 제한된 공급이 하류 및 원가 약세의 반영 속도를 낮추는 것으로 해석."}], "outlooks": {"brent": {"dir": "하락 · 위험 프리미엄 축소 지속", "b": ["중동 관련 공식 발표", "다음 선물 마감"]}, "wti": {"dir": "하락 · 브렌트와 동반한 원유 약세", "b": ["중동 관련 공식 발표", "다음 선물 마감"]}, "dubai": {"dir": "하락 · 현물과 선물의 동반 약세", "b": ["현물 거래 수준", "현물 프리미엄"]}, "naph": {"dir": "하락 · 원유 약세와 현물 구매 관망", "b": ["12월 인도분 구매", "현금 프리미엄"]}, "ethylene": {"dir": "보합 · 제한된 현물 공급과 매수 저항의 대치", "b": ["12월 화물 오퍼", "나프타 가격"]}, "propylene": {"dir": "하락 · 원유 약세와 산둥성 공급 회복", "b": ["설비 재가동", "중국 내 가격"]}, "benz": {"dir": "하락 · 원유·선물 약세와 구매 관망", "b": ["한국 선적 거래", "중국 벤젠 선물"]}, "sm": {"dir": "하락 · 벤젠 약세와 하류 구매 지연", "b": ["화동 지역 항구 재고", "PS 오퍼"]}, "bd": {"dir": "보합 · 상류 약세와 현물 부족의 대치", "b": ["합성고무 선물", "12월 화물 오퍼"]}, "pp": 합.", "up": "12월 오퍼 상승", "dn": "매도 호가 인하", "act": "확정수요분 확보"}, "propylene": {"why": "원유 약세와 산둥성 일부 설비 재가동이 함께 작용.", "up": "공급 제약 재확대", "dn": "국내 공급 증가", "act": "신규물량 재협상"}, "benz": {"why": "원유·선물 약세가 이어졌고 기준일 한국 선적 거래도 낮은 수준.", "up": "원유 반등", "dn": "중국 선물 추가 하락", "act": "급한 물량 분할"}, "sm": {"why": "벤젠 약세, 항구 재고 증가, PS 구매 관망이 겹친 상태.", "up": "벤젠 안정과 재고 감소", "dn": "PS 구매 지연", "act": "매수시점 분산"}, "bd": {"why": "합성고무 약세에도 12월 현물 공급 제약이 하단을 지지.", "up": "12월 오퍼 상승", "dn": "합성고무 선물 하락", "act": "필요량만 확보"}, "pp": {"why": "프로필렌 약세와 구매 축소가 최근 공급 제약의 지지를 약화.", "up": "중국 공급 축소", "dn": "구매 관망 확대", "act": "오퍼인하 요청"}, "an": {"why": "프로필렌은 하락했지만 극동아시아 공급은 제한적이고 한국 생산자 오퍼는 높게 유지.", "up": "현물 오퍼 상승", "dn": "중국 가격 약세 확대", "act": "계약필요분 확보"}}, "signals": [{"title": "Brent-WTI 스프레드", "body": "기준일 5.45달러/배럴로 전일 5.72달러/배럴보다 0.27달러 축소. 브렌트와 WTI의 근월물 계약월은 각각 2027년 1월과 2026년 12월이므로 동일 인도월의 가격차로 해석하지 않는 것이 적절."}, {"title": "원유 모멘텀", "body": "브렌트는 전일 대비 1.08달러, WTI는 0.81달러 하락했으며 두 가격 모두 최근 5거래일 전 수준보다 낮음. 원료 가격의 단기 하방 압력이 지속되는 신호."}, {"title": "화학제품 모멘텀", "body": "직전 발표일 대비 벤젠 98.33달러, 스티렌 81달러, 프로필렌 30달러, PP 20달러 하락하고 에틸렌은 보합. 방향족과 PP의 약세가 에틸렌보다 뚜렷한 구도."}, {"title": "SM-벤젠 스프레드", "body": "기준일 스티렌 중국 도착 가격과 벤젠 한국 선적 가격의 차이는 232달러/톤으로 직전 공동 발표일의 214.67달러/톤보다 17.33달러 확대. 인도조건이 달라 실제 제조마진이 아닌 방향성 참고 지표."}], "flag": "① 원유 선물의 추가 급락 또는 반등 ② 산둥성 프로판 탈수소 설비의 재가동 확대 또는 재중단 ③ 스티렌 화동 지역 항구 재고의 11월 9일 기록인 3만7600톤 대비 증감 ④ 12월 인도 에틸렌·부타디엔 현물 오퍼의 인하 또는 인상", "exec": ["【기】 원유와 나프타 급락이 벤젠·스티렌·프로필렌·PP 가격에 반영된 기준일.", "【승】 에틸렌·부타디엔·아크릴로니트릴은 제한된 현물 공급으로 하락 속도가 다른 시장.", "【결】 하락 품목은 분할 구매·가격 재협상, 공급 제약 품목은 확정 소요량 우선 확보."], "tnote": "기준일 평가값을 각 품목의 직전 실제 발표값과 비교한 결과이며, 선물의 비교일은 11월 9일, 나머지 일간 품목은 11월 6일, 주간 아크릴로니트릴은 11월 3일임. 브렌트는 ICE 1월물 정산가, WTI는 NYMEX 12월물 정산가, 두바이는 근월물 절대가격임. 나프타는 일본 도착, 에틸렌은 동북아 도착, 프로필렌·스티렌·부타디엔은 중국 도착, 벤젠은 한국 선적, PP와 아크릴로니트릴은 극동아시아 도착 조건임. 평가 명세상 계약월·화물 평가기간의 직전 발표일 대비 변경은 나타나지 않으며, 주간 ABS·GPPS·HIPS는 기준일 평가가 발행되지 않아 제외.", "src": "ICLL001, NMCL001, PCAAT00, PAAAD00, AAOTM00, AAWWK00, PHASM05, AAMFI00, AAWWL00, PHBIK00, PHAOO00. Platts 원유 선물 마감 시황, Crude Oil Marketwire, Platts Middle East Sour Crude Daily Market Analysis, Platts Asia and Middle Eastern Naphtha Daily Market Analysis, Platts Asian Ethylene·Propylene·Benzene·Styrene Monomer·Butadiene·Polypropylene·ACN 시황, ASIA PETROCHEMICALS 시장지표."}, "en": {"summary": "Brent and WTI fell $1.08 and $0.81 from the previous day, respectively, and Dubai fell $8.48 from its previous publication date. Naphtha lost $68, benzene $98.33 and SM $81, as weakness spread from feedstock to aromatic products. Propylene, BD and PP also fell, while ethylene and weekly acrylonitrile were unchanged. After a rebound earlier this month, the declines in crude and aromatics have resumed. Overall, a shrinking geopolitical risk premium and buyer hesitancy are pressuring prices, while limited spot supply of ethylene, BD and acrylonitrile slows the pace of declines.", "pc": {"brent": "January Brent settled at $91.49/b, down $1.08 from the previous day. Expectations of easing tensions grew after the US president said further attacks on Iran were unlikely, which was the direct backdrop to the weaker close. After the Nov. 6 rebound, prices fell on both Nov. 9 and 10. The larger intraday drop in Asian trading and the final settlement's day-on-day decline are prices observed at different times. Weaker crude led to weaker cost support for naphtha and aromatics.", "wti": "December WTI settled at $86.04/b, down $0.81 from the previous day. The same day's crude futures close commentary cited expectations of easing US-Iran tensions as the reason for the decline. After falling from $90.83/b on Nov. 6 to $86.85/b on Nov. 9, weakness continued. It fell alongside Brent, but the day-on-day decline was smaller than Brent's. A parallel indicator of weaker international crude, relevant to judging the direction of petrochemical feedstocks.", "dubai": "Front-month Dubai outright was $87.82/b, down $8.48 from Nov. 6. Middle East crude commentary said physical prices and spreads fell together after news that additional military attacks were on hold. The cash Dubai premium to same-month futures also narrowed to 25 cents/b, a figure separate from the outright price. The price that rebounded on Nov. 6 after Nov. 5's decline fell again. Downward pressure on Asian naphtha's cost environment as well.", "naph": "Japan-delivered naphtha was $860.25/mt, down $68 from the previous publication date. The day's commentary cited expectations of easing Middle East tensions, lower freight and limited spot demand for first-half December delivery as pressures on the cash premium. Mitsui Chemicals' purchase of 25,000 mt of second-half December-delivery naphtha for Osaka was also reported, showing that tight supply and absent buying were not applied uniformly across the market. After Nov. 5's sharp drop and the Nov. 6 rebound, prices fell again on the assessment date. Lower naphtha reduces cracker costs, but is not yet immediately reflected in ethylene prices.", "ethylene": "Northeast Asia-delivered ethylene was $1,240/mt, unchanged from the previous publication date. Selling ideas for a 3,500-mt December-delivery cargo were $1,290/mt, while tradable levels in Northeast Asia were reported at $1,240/mt, so the buyer-seller gap persisted. The day's commentary cited buyer hesitation on weaker naphtha and limited spot supply as parallel factors behind the flat price. After rising $10 on Nov. 4, the price was unchanged on Nov. 5, 6 and 10. A period in which pass-through between feedstock and ethylene prices lagged despite lower naphtha costs.", "propylene": "China-delivered polymer-grade propylene was $1,370/mt, down $30 from the previous publication date. The day's commentary directly blamed lower crude and also reported increased domestic supply from the restart of some PDH units in Shandong. Shandong prices were assessed at Yuan 11,100/mt, Yuan 300/mt lower than the previous publication date. After holding near $1,420/mt in early November, prices fell on both Nov. 6 and 10. A change that also weighs on downstream PP buying sentiment.", "benz": "FOB Korea benzene was $937/mt, down $98.33 from the previous publication date. The day's commentary cited joint weakness in crude and futures markets as the cause and recorded Centalion's sale of December-loading cargo to GS Caltex at $944/mt. Chinese benzene futures also fell, and Sinopec cut its East China list price by Yuan 300/mt. The decline that continued through Nov. 5 rebounded slightly on Nov. 6 before deepening again. Benzene weakness lowers cost support for SM.", "sm": "China-delivered SM was $1,169/mt, down $81 from the previous publication date. The day's commentary directly attributed the decline to reduced cost support from weaker crude and benzene. East China port stocks were 37,600 mt on Nov. 9, up 6,900 mt on the week, and Chinese PS producers said buyers were waiting for further declines despite lowered offers. The decline that had continued since early November resumed after holding flat on Nov. 6. Cost declines and buyer hesitancy are acting together on downstream PS price negotiations.", "bd": "China-delivered BD was $1,830/mt, down $10 from the previous publication date. The day's commentary cited weaker crude, naphtha and Chinese synthetic rubber futures as the backdrop. Meanwhile, Korean sellers said December spot availability was very limited and offered at $1,870/mt. From $1,880/mt in early November, prices fell successively on Nov. 5, 6 and 10, though by less than naphtha. Weaker synthetic rubber prices and limited BD supply are mixed signals for downstream demand.", "pp": "Far East Asia-delivered raffia PP was $1,330/mt, down $20 from the previous publication date. On Nov. 4 it rose to $1,370/mt amid high propylene costs and supply constraints, but assessments have since fallen. Weekly market data said Chinese and Southeast Asian buyers cut purchases in expectation of lower prices. On the supply side, the low incentive for Chinese PDH units to run at high propane prices had been identified earlier. Propylene also fell on the assessment date, weakening cost support for PP.", "an": "Weekly Far East Asia-delivered acrylonitrile was $1,800/mt, unchanged from the Nov. 3 publication. The Nov. 10 acrylonitrile commentary said Chinese prices weakened following propylene's decline, while Far East Asian prices were supported by limited supply. Korean producers held their selling levels, citing high costs and limited spot offers. On Nov. 3 it had risen $190 from the previous week against a backdrop of strong propylene and ammonia. Upstream propylene weakened this week, but this was not reflected in Far East Asia-delivered prices."}, "pj": {"brent": "Shrinking risk of further attacks is judged the main cause of the recent decline. With weight on near-term weakness, staged purchasing of crude-linked volumes is appropriate.", "wti": "The shrinking geopolitical risk premium shared with Brent is dominant. The next price direction is judged to be lower, and reducing advance purchases beyond urgent volumes is appropriate.", "dubai": "The shrinking Middle East crude risk premium is judged to have led the decline in the outright price. With weight on a near-term decline, renegotiating prices in cost-linked contracts is advantageous.", "naph": "Weaker crude and hesitant spot buying are judged to have been reflected in prices more than tight supply. A near-term decline is expected, and staging purchases starting with essential volumes is appropriate.", "ethylene": "Limited spot supply is judged to be the force blocking pass-through of the naphtha decline. With weight on a near-term flat outlook, purchases centered on confirmed demand are appropriate.", "propylene": "The key point is that Shandong's supply recovery has been added to the crude decline. A near-term decline is expected, and this is a phase in which negotiating leverage on new purchases improves.", "benz": "Crude and futures weakness led, and buyer hesitancy is judged to have reinforced the decline. With weight on a near-term decline, staged buying of needed volumes after the sharp drop is appropriate.", "sm": "Reduced cost support from crude and benzene is judged the most likely main cause. With rising stocks and downstream hesitancy added, delaying purchases on a near-term decline is advantageous.", "bd": "Upstream and synthetic rubber weakness set the downward direction, but limited spot supply is judged to have restrained the decline. With weight on a near-term flat outlook, securing only confirmed production volumes is appropriate.", "pp": "Falling crude and propylene and buyer hesitancy are judged to have overtaken the earlier supply constraints. With weight on a near-term decline, renegotiating purchase prices is advantageous.", "an": "Limited Far East Asian spot supply and high selling intentions are judged to have offset propylene weakness. With weight on a near-term flat outlook, sourcing centered on contract-required volumes is appropriate."}, "factors": [{"title": "Macro · Crude risk premium", "body": "Brent and WTI both closed lower on Nov. 10. The crude close commentary cited remarks that the likelihood of further US attacks on Iran had fallen, and expectations of easing tensions. Weakness continued after Nov. 9's large decline. Interpreted as weakening price support for crude-linked feedstocks."}, {"title": "Macro · Dubai price", "body": "Dubai's outright price fell $8.48 from Nov. 6. The gap between cash and futures also narrowed over the same period. The trend shifted from the Nov. 6 rebound to a decline on the assessment date. Interpreted as a signal supporting weakness in Asian feedstock prices."}, {"title": "Demand · Naphtha spot", "body": "Limited buying interest for first-half December delivery was cited as pressure on the naphtha cash premium. On the other hand, Mitsui Chemicals' purchase for second-half December delivery is also a case in point. Earlier, in early November, tight supply had supported the naphtha market. Interpreted as falling outright prices and tight spot supply coexisting because of timing differences in demand."}, {"title": "Supply · Ethylene", "body": "With Northeast Asian spot supply limited, selling ideas for December cargo were higher than tradable levels. Naphtha fell sharply on the assessment date, but ethylene was unchanged. The same price has held since the Nov. 4 rise. Interpreted as supply constraints delaying the pass-through of short-term cost declines."}, {"title": "Supply · Propylene", "body": "Reports said the restart of some PDH units in Shandong increased supply in China. China-delivered propylene fell $30 from the previous publication date. The direction has changed from the high prices of early November's tight supply. Interpreted as supply recovery amplifying the price effect of weaker crude."}, {"title": "Demand · Aromatics and resins", "body": "Benzene fell amid weaker Chinese futures and slowing year-end downstream demand. SM also fell as cost support weakened, and PS producers said buyers responded weakly to lowered offers. After the temporary flat or rebound on Nov. 6, both products fell again. Interpreted as downstream hesitancy strengthening the force that transmits lower feedstock prices to product prices."}, {"title": "Supply · Butadiene and acrylonitrile", "body": "BD sellers cited limited December spot volumes, and Far East Asian acrylonitrile was also supported by tight supply. Meanwhile, BD's synthetic rubber futures and acrylonitrile's feedstock propylene were weak. After last week's strength, the two products' assessment-date price changes were a slight decline and flat, respectively. Interpreted as limited supply slowing the pace at which cost weakness is reflected."}], "outlooks": {"brent": {"dir": "Down · Continued shrinking of the risk premium", "b": ["Official Middle East statements", "Next futures settlement"]}, "wti": {"dir": "Down · Crude weakness alongside Brent", "b": ["Official Middle East statements", "Next futures settlement"]}, "dubai": {"dir": "Down · Joint weakness in physical and futures", "b": ["Physical trading levels", "Physical premium"]}, "naph": {"dir": "Down · Weaker crude and hesitant spot buying", "b": ["December-delivery purchases", "Cash premium"]}, "ethylene": {"dir": "Flat · Limited spot supply against buyer resistance", "b": ["December cargo offers", "Naphtha price"]}, "propylene": {"dir": "Down · Weaker crude and recovering Shandong supply", "b": ["PDH restarts", "Chinese domestic prices"]}, "benz": {"dir": "Down · Weak crude and futures with hesitant buying", "b": ["Korea-loading trades", "Chinese benzene futures"]}, "sm": {"dir": "Down · Weaker benzene and delayed downstream purchases", "b": ["East China port stocks", "PS offers"]}, "bd": {"dir": "Flat · Weaker upstream against tight spot availability", "b": ["Synthetic rubber futures", "December cargo offers"]}, "pp": {"dir": "Down · Lower propylene and reduced purchasing", "b": ["Chinese purchase volumes", "PDH unit operating rates"]}, "an": {"dir": "Flat · Weaker propylene against tight Far East Asia supply", "b": ["Korean producer offers", "Chinese domestic prices"]}}, "infos": [{"tag": "Maintenance", "body": "LG Chem said on Oct. 29 that it had shut its No. 1 Yeosu naphtha cracker from Oct. 23 and planned to restart it on Dec. 11."}, {"tag": "Operating rates", "body": "LG Chem gave its No. 2 Yeosu unit's operating rate at the time as 89% and its Daesan unit's as 72%."}, {"tag": "Operating rates", "body": "Thailand's IRPC cut its November Rayong naphtha cracker operating rate to 70% from 90% in October, it reported on Nov. 4."}, {"tag": "Plant", "body": "Japan's Maruzen Petrochemical plans to permanently close its Chiba naphtha cracker from the second half of November, trade participants said."}, {"tag": "Port stocks", "body": "East China SM port stocks were 37,600 mt on Nov. 9, up 6,900 mt on the week."}, {"tag": "Port stocks", "body": "East China benzene port stocks were 34,000 mt on Nov. 4, down 1,000 mt on the week."}, {"tag": "Inventory", "body": "Chinese butadiene port stocks were slightly above 30,000 mt around Nov. 5, up on the week, according to market participants."}, {"tag": "Coming-week schedule", "body": "The timing of Japan's Maruzen Petrochemical's planned permanent closure of its Chiba unit is the second half of November."}], "ai": "Over the next five business days, the base direction is a sequential pass-through of falling crude, falling naphtha, and weaker aromatics and PP. On Nov. 10 naphtha fell sharply while ethylene was unchanged, so declines in feedstock have not been reflected at the same speed across all petrochemical products. Propylene faces greater downward pressure than ethylene because China's domestic supply recovery is added. Benzene and SM are inclined toward further weakness as hesitant Chinese downstream buying is added to their recent downtrend. BD, whose limited spot volumes support prices despite synthetic rubber weakness, and Far East Asian acrylonitrile, whose high selling intentions persist, are centered on flat. Key variables next week are the crude closing direction, Shandong unit operations, December-delivery cargo offers and East China inventory changes. For procurement, reducing bulk advance purchases of products in decline and first securing confirmed requirements for supply-constrained products is appropriate.", "scen": [{"body": "Easing Middle East tension expectations and continued downstream hesitancy → crude, naphtha, aromatics and PP decline, ethylene, BD and acrylonitrile flat → stage purchases of declining products and secure needs for supply-constrained products"}, {"body": "Crude rebound and recovering December cargo buying → naphtha and supply-constrained petrochemicals rebound → secure near-term needs early"}, {"body": "Further crude decline and wider Chinese downstream purchase delays → naphtha, aromatics, propylene and PP declines deepen → defer nonessential purchases and renegotiate prices"}], "fc": {"brent": {"why": "Closing prices were pressured by expectations of easing tensions, but recent daily volatility is high.", "up": "Renewed military escalation", "dn": "Stronger expectations of easing tensions", "act": "Stage crude-linked volumes"}, "wti": {"why": "It fell alongside Brent, and recent futures price swings are large.", "up": "Crude rebounds together", "dn": "Further shrinking of the risk premium", "act": "Urgent volumes first"}, "dubai": {"why": "It fell sharply from the previous publication date and the physical premium also narrowed.", "up": "Recovery in physical buying", "dn": "Further narrowing of the physical premium", "act": "Renegotiate linked pricing"}, "naph": {"why": "Weaker crude and hesitant buying were reflected in prices more strongly than tight supply.", "up": "More December cargo buying", "dn": "Weakening cash premium", "act": "Stage essential volumes"}, "ethylene": {"why": "Prices were unchanged on the assessment date because of limited spot supply despite the sharp naphtha drop.", "up": "Higher December offers", "dn": "Lower selling offers", "act": "Secure confirmed demand volumes"}, "propylene": {"why": "Weaker crude and the restart of some Shandong units are acting together.", "up": "Renewed supply constraints", "dn": "Rising domestic supply", "act": "Renegotiate new volumes"}, "benz": {"why": "Crude and futures weakness continued, and Korea-loading trades on the assessment date were also at low levels.", "up": "Crude rebound", "dn": "Further decline in Chinese futures", "act": "Stage urgent volumes"}, "sm": {"why": "Weaker benzene, rising port stocks and PS buyer hesitancy overlap.", "up": "Stable benzene and falling stocks", "dn": "Delayed PS purchases", "act": "Spread out buying timing"}, "bd": {"why": "Despite weaker synthetic rubber, limited December spot supply supports the lower end.", "up": "Higher December offers", "dn": "Lower synthetic rubber futures", "act": "Secure needed volumes only"}, "pp": {"why": "Weaker propylene and reduced purchasing have weakened the support from recent supply constraints.", "up": "Reduced Chinese supply", "dn": "Wider buyer hesitancy", "act": "Request lower offers"}, "an": {"why": "Propylene fell, but Far East Asian supply is limited and Korean producers' offers remain high.", "up": "Higher spot offers", "dn": "Wider Chinese price weakness", "act": "Secure contract-required volumes"}}, "signals": [{"title": "Brent-WTI spread", "body": "On the assessment date the spread was $5.45/b, down $0.27/b from $5.72/b the previous day. Because the front-month contract months for Brent and WTI are January 2027 and December 2026, respectively, it is not appropriate to read this as a price gap for the same delivery month."}, {"title": "Crude momentum", "body": "Brent fell $1.08 and WTI $0.81 from the previous day, and both prices are below their levels five trading days ago. A signal that short-term downward pressure on feedstock prices is continuing."}, {"title": "Chemical momentum", "body": "Versus the previous publication date, benzene fell $98.33, SM $81, propylene $30 and PP $20, while ethylene was unchanged. Weakness in aromatics and PP is more pronounced than in ethylene."}, {"title": "SM-benzene spread", "body": "On the assessment date the difference between China-delivered SM and FOB Korea benzene was $232/mt, widening $17.33/mt from $214.67/mt on the previous shared publication date. Because delivery terms differ, it is a directional reference rather than an actual manufacturing margin."}], "flag": "① Sharp further decline or rebound in crude futures ② Wider restart or renewed shutdown of PDH units in Shandong ③ Change from the Nov. 9 record of 37,600 mt in East China SM port stocks ④ Cut or rise in December-delivery ethylene and BD spot offers", "exec": ["[Intro] The assessment date on which the crude and naphtha plunge was reflected in benzene, SM, propylene and PP prices.", "[Development] Ethylene, BD and acrylonitrile are markets where limited spot supply makes the pace of decline differ.", "[Conclusion] For declining products, stage purchases and renegotiate prices; for supply-constrained products, secure confirmed requirements first."], "tnote": "The assessment-date values are compared with each product's immediately preceding actual published values; the comparison date is Nov. 9 for futures, Nov. 6 for the other daily products and Nov. 3 for weekly acrylonitrile. Brent is the ICE January contract settlement, WTI the NYMEX December contract settlement and Dubai the front-month outright price. Naphtha is Japan-delivered, ethylene Northeast Asia-delivered, propylene, SM and BD China-delivered, benzene FOB Korea, and PP and acrylonitrile Far East Asia-delivered. The assessment specifications show no change in contract month or cargo assessment period from the previous publication date, and weekly ABS, GPPS and HIPS are excluded because no assessments were published on the assessment date.", "src": "ICLL001, NMCL001, PCAAT00, PAAAD00, AAOTM00, AAWWK00, PHASM05, AAMFI00, AAWWL00, PHBIK00, PHAOO00. Platts crude futures close commentary, Crude Oil Marketwire, Platts Middle East Sour Crude Daily Market Analysis, Platts Asia and Middle Eastern Naphtha Daily Market Analysis, Platts Asian Ethylene, Propylene, Benzene, Styrene Monomer, Butadiene, Polypropylene and ACN commentary, ASIA PETROCHEMICALS market indicators."}};

var lang="ko";
function el(i){return document.getElementById(i)}
function clean(x){return String(x).replace(/\^[^\^\s]{1,6}\^/g,"").replace(/\s?\[\d{1,3}(?:\s*[,\-]\s*\d{1,3})*\]/g,"").replace(/\\([~*_`])/g,"$1").replace(/\^/g,"")}
function esc(x){return clean(x).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function dec(v){return Math.abs(v-Math.round(v))<1e-9?0:Math.abs(v*100-Math.round(v*100))<1e-6?2:3}
function fmt(v,p){return Number(v).toLocaleString("en-US",{minimumFractionDigits:p,maximumFractionDigits:p})}
function fu(p,v){return fmt(v,Math.max(p.uom==="$/bbl"?2:0,dec(v)))}
function sg(v,p){return(v>0?"+":"")+fmt(v,p)}
function cls(d){return d>0?"up":d<0?"down":"flat"}
function arw(d){return d>0?"▲":d<0?"▼":"–"}
function setLang(l){if(l==="en"&&!T.en)return;lang=l;render()}
function render(){
var u=U[lang],t=T[lang]||T.ko;
document.documentElement.lang=lang;
el("h-title").textContent=u.title;el("h-sub").textContent=u.sub.replace("{D}",REPORT[lang]);
el("b-ko").setAttribute("aria-pressed",String(lang==="ko"));el("b-en").setAttribute("aria-pressed",String(lang==="en"));
el("b-en").style.display=T.en?"":"none";el("b-pdf").textContent=u.pdf;
for(var i=1;i<=5;i++){el("l"+i).textContent="0"+i+" / "+u.s[i-1];el("t"+i).textContent=i===1?u.t1:u.s[i-1]}
var k="",r="",c="";
KEYS.forEach(function(key){
var p=PRICES[key],np=!!p.np;
var d=np?0:p.val-p.prev,p2=Math.max(p.uom==="$/bbl"?2:0,dec(d)),pct=(!np&&p.prev)?100*d/p.prev:0,q=np?"flat":cls(d),sh=(np||d===0)?"–":sg(d,p2),di=np?u.np:u.dir[d>0?0:d<0?1:2];
var bd=(!np&&p.date!==REPORT.iso)?'<span class="dt">'+esc(u.diff.replace("{D}",p.date))+'</span>':"";
var rb=p.roll?'<span class="dt rl">'+u.rl+'</span>':"";
var lt=(np&&typeof p.last==="number")?u.npd+" "+fu(p,p.last)+(p.lastDate?" ("+p.lastDate+")":""):"";
var vt=np?u.np:fu(p,p.val);
var ct=np?esc(lt||u.np):arw(d)+' '+sh+' ('+sg(pct,2)+'%)';
k+='<div class="card kpi" style="--pc:'+COL[key]+'"><div class="kt">'+esc(p.name)+bd+rb+'</div><div class="kv">'+vt+'</div><div class="meta">'+esc(p.kind)+' · '+esc(p.uom)+'<br><span class="'+q+'">'+ct+'</span> · '+esc(p.sym)+'</div></div>';
r+='<tr><td>'+esc(p.name)+bd+rb+'</td><td>'+esc(p.sym)+'</td><td>'+vt+'</td><td>'+esc(p.uom)+'</td><td class="'+q+'">'+sh+'</td><td class="'+q+'">'+(np?"–":sg(pct,2)+'%')+'</td><td class="'+q+'">'+(np?"– "+u.np:arw(d)+' '+di)+'</td><td>'+(np?esc(lt||"–"):esc(p.basis)+' '+esc(p.prevDate))+'</td></tr>';
c+='<div class="pc"><div class="pct" style="color:'+COL[key]+'">'+esc(p.name)+bd+rb+'<span class="pill '+q+'">'+(np?"– "+u.np:arw(d)+' '+di+' '+sg(pct,2)+'%')+'</span></div><p>'+esc((t.pc&&t.pc[key])||u.na)+'</p>'+((t.pj&&t.pj[key])?'<p class="aij"><span class="tag">'+u.pjL+'</span>'+esc(t.pj[key])+'</p>':'')+'</div>';
});
el("kpis").innerHTML=k;
el("thead").innerHTML="<tr>"+u.th.map(function(h){return"<th>"+esc(h)+"</th>"}).join("")+"</tr>";
el("tbody").innerHTML=r;el("tnote").textContent=clean(t.tnote||"");
el("summary").innerHTML="<b>"+u.sumL+"</b>"+esc(t.summary||u.na);el("pcs").innerHTML=c;
el("factors").innerHTML=(t.factors||[]).map(function(o){return'<div class="card fc"><b>'+esc(o.title)+'</b><p>'+esc(o.body)+'</p></div>'}).join("");

el("infos").innerHTML=(t.infos||[]).map(function(o){return'<div class="card info"><span class="tag">'+esc(o.tag)+'</span>'+esc(o.body)+'</div>'}).join("");
el("ai").textContent=clean(t.ai||"");
el("sc-t").textContent=u.scT;el("fc-t").textContent=u.fcT;el("fc-n").textContent=u.fcN;el("sg-t").textContent=u.sgT;
var SC=["#0ea5e9","#dc2626","#2563eb"],sh2="";
for(var j=0;j<3;j++){var sb=(t.scen&&t.scen[j]&&t.scen[j].body)||u.na,sp=(typeof SCEN!=="undefined"&&typeof SCEN[j]==="number")?SCEN[j]+"%":"";sh2+='<div class="card sc" style="--sc:'+SC[j]+'"><b>'+esc(u.scn[j])+(sp?' · '+esc(sp):'')+'</b><p>'+esc(sb)+'</p></div>'}
el("scen").innerHTML=sh2;
var fh="";
KEYS.forEach(function(key){
var p=PRICES[key],f=(typeof FC!=="undefined"&&FC[key])||null,x=(t.fc&&t.fc[key])||{};
var ref=p.np?p.last:p.val;
var ok=f&&typeof f.lo==="number"&&typeof f.hi==="number"&&f.hi>=f.lo&&typeof ref==="number";
var hd='<b style="color:'+COL[key]+'">'+esc(p.name)+'</b>';
if(!ok){fh+='<div class="card">'+hd+'<p>'+esc(u.na)+'</p></div>';return}
var mid=(f.lo+f.hi)/2,ch=100*(mid-ref)/ref,dc=ch>0.5?1:ch<-0.5?-1:0,ci={h:0,m:1,l:2}[f.conf];
fh+='<div class="card">'+hd+'<div class="fh"><span class="pill big '+cls(dc)+'">'+arw(dc)+' '+u.dir[dc>0?0:dc<0?1:2]+'</span><span class="'+cls(dc)+'">'+sg(ch,1)+'%</span></div>'
+'<div class="rng">'+u.rng+' '+fu(p,f.lo)+' ~ '+fu(p,f.hi)+' '+esc(p.uom)+'</div>'
+'<div class="meta">'+u.confL+' · '+(ci===undefined?u.na:u.conf[ci])+(p.np?' · '+u.npd+' '+fu(p,ref):'')+'</div>'
+'<p>'+esc(x.why||u.na)+'</p>'
+(x.up?'<div class="tri"><b>'+u.upL+'</b> '+esc(x.up)+'</div>':'')
+(x.dn?'<div class="tri"><b>'+u.dnL+'</b> '+esc(x.dn)+'</div>':'')
+(x.act?'<div class="act">'+u.actL+' · '+esc(x.act)+'</div>':'')+'</div>';
});
el("fcs").innerHTML=fh;
el("signals").innerHTML=(t.signals||[]).map(function(o){return'<div class="card"><b>'+esc(o.title)+'</b><p>'+esc(o.body)+'</p></div>'}).join("");
el("flag").innerHTML="<b>"+u.flagL+"</b><br>"+esc(t.flag||"");
el("exec").innerHTML=(t.exec||[]).map(function(s){return"<div>"+esc(s)+"</div>"}).join("");
el("src").textContent=clean(t.src||"");
}
render();
</script>
