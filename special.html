<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PlattsAI Special Report</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e2e8f0;color:#0f172a}.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:9px 12px;background:#0f172a;color:#fff}.back,.reload,.download{border:1px solid #64748b;background:#1e293b;color:#fff;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:800;cursor:pointer;text-decoration:none}.download:disabled{opacity:.45;cursor:not-allowed}.meta{min-width:0;flex:1}.title{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10px;color:#94a3b8;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.frame{display:block;width:100%;border:0;background:white;min-height:calc(100vh - 52px)}.loading,.error{margin:22px auto;max-width:720px;background:white;border:1px solid #cbd5e1;border-radius:12px;padding:28px 18px;text-align:center;font-size:13px}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0f172a;color:white;border-radius:9px;padding:8px 12px;font-size:11px;display:none}@media(max-width:600px){.bar{padding:7px}.title{font-size:11px}.sub{font-size:9px}}

</style></head><body><div class="bar"><a class="back" href="index.html">← 목록</a><div class="meta"><div class="title" id="title">기획 시황 불러오는 중…</div><div class="sub" id="sub">Google Sheet DB</div></div><button class="download" id="download" disabled>🔒 HTML</button><button class="reload" id="reload">↻ 새로고침</button></div><div id="host"><div class="loading">기획 시황을 불러오는 중입니다…</div></div><div class="toast" id="toast"></div><script>
(function(){const GAS='https://script.google.com/macros/s/AKfycbwak8tk4J1wWxEo6ksXjYEIXbqe34JkqqE9EbMCHey72-aR4J5LNZ7YLHdihUEgQaFI/exec',$=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let frame=null,sourceHtml='',sourceName='';function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2000)}function fit(f){try{let d=f.contentDocument;if(!d)return;const resize=()=>{try{f.style.height=Math.max(innerHeight-52,d.documentElement.scrollHeight,d.body?.scrollHeight||0)+'px'}catch(e){}};resize();[100,500,1200,2300].forEach(ms=>setTimeout(resize,ms));if(window.ResizeObserver&&d.body){let obs=new ResizeObserver(resize);obs.observe(d.body);f._obs=obs}}catch(e){}}function safeName(s){return String(s||'').replace(/[\\/:*?"<>|]/g,'_')}function downloadHtml(){window.PlattsDownloadModal.open({type:'special',id:new URLSearchParams(location.search).get('id')||'',title:$('title').textContent||'기획 시황'})}async function load(){sourceHtml='';sourceName='';$('download').disabled=true;let id=new URLSearchParams(location.search).get('id');if(!id){$('host').innerHTML='<div class="error">리포트 ID가 없습니다. 목록에서 다시 선택해 주세요.</div>';return}try{let r=await fetch(GAS+'?action=getSpecialReport&id='+encodeURIComponent(id)+'&_='+Date.now(),{cache:'no-store',redirect:'follow'});if(!r.ok)throw Error('HTTP '+r.status);let j=await r.json();if(!j.ok)throw Error(j.error||'API 오류');if(!j.found||!j.html)throw Error('저장된 기획 시황이 없습니다.');let m=j.meta||{};$('title').textContent=m.title||'기획 시황';$('sub').textContent=[m.date,m.fileName].filter(Boolean).join(' · ');document.title=$('title').textContent+' | PlattsAI';sourceHtml=j.html;sourceName=m.fileName||m.filename||('plattsAI_S_'+String(m.date||'').replace(/-/g,'')+'_report.html');$('download').disabled=false;let f=document.createElement('iframe');f.className='frame';f.title='기획 시황 원본';f.setAttribute('allow','clipboard-read; clipboard-write; fullscreen');f.srcdoc=j.html;frame=f;$('host').replaceChildren(f);f.addEventListener('load',()=>fit(f))}catch(e){$('title').textContent='기획 시황 로드 실패';$('host').innerHTML='<div class="error">'+E(e.message||e)+'</div>'}}window.addEventListener('message',e=>{if(!frame||e.source!==frame.contentWindow)return;let m=e.data||{};if(m.__widget==='download-file'&&typeof m.dataUrl==='string'&&/^data:image\/png;base64,/.test(m.dataUrl)){let a=document.createElement('a');a.href=m.dataUrl;a.download=String(m.filename||'chart.png').replace(/[\\/:*?"<>|]/g,'_');document.body.appendChild(a);a.click();a.remove()}if(m.__widget==='copy-image'&&typeof m.dataUrl==='string'&&/^data:image\/png;base64,/.test(m.dataUrl)){if(!navigator.clipboard||typeof ClipboardItem==='undefined'){toast('이미지 복사를 지원하지 않습니다.');return}fetch(m.dataUrl).then(r=>r.blob()).then(b=>navigator.clipboard.write([new ClipboardItem({'image/png':b})])).then(()=>toast('이미지 복사 완료')).catch(()=>toast('이미지 복사 실패'))}});$('download').onclick=downloadHtml;$('reload').onclick=()=>location.reload();load()})();
</script>
<div id="plattsDlModal" role="dialog" aria-modal="true" aria-label="HTML 다운로드 비밀번호 입력" hidden>
  <div class="plattsDlPane">

<script>
(function(){'use strict';
const el=document.getElementById('plattsDlModal'),frame=document.getElementById('plattsDlIframe'),label=document.getElementById('plattsDlDescription'),closeBtn=document.getElementById('plattsDlClose');
const base='https://script.google.com/macros/s/AKfycbwak8tk4J1wWxEo6ksXjYEIXbqe34JkqqE9EbMCHey72-aR4J5LNZ7YLHdihUEgQaFI/exec';
let previousFocus=null;
function close(){el.hidden=true;frame.removeAttribute('src');document.body.style.overflow='';if(previousFocus&&previousFocus.isConnected)previousFocus.focus();}
function open(data){const t=String(data.type||''),id=String(data.id||''),date=String(data.date||'');if(!['daily','weekly','special'].includes(t))return;previousFocus=document.activeElement;label.textContent=String(data.title||'보고서')+' · '+(date||id);const url=new URL(base);url.searchParams.set('page','admin');url.searchParams.set('mode','download');url.searchParams.set('type',t);if(date)url.searchParams.set('date',date);if(id)url.searchParams.set('id',id);el.hidden=false;document.body.style.overflow='hidden';frame.src=url.href;closeBtn.focus();}
closeBtn.addEventListener('click',close);
el.addEventListener('click',e=>{if(e.target===el)close();});
document.addEventListener('keydown',e=>{if(!el.hidden&&e.key==='Escape'){e.preventDefault();close();}});
window.PlattsDownloadModal={open,close};
})();
</script>
