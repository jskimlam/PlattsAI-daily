<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PlattsAI Special Report</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#e2e8f0;color:#0f172a}.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:9px 12px;background:#0f172a;color:#fff;box-shadow:0 1px 5px rgba(15,23,42,.25)}.back,.reload{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.09);color:#fff;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:800;cursor:pointer;text-decoration:none}.meta{min-width:0;flex:1}.title{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:9.5px;color:#94a3b8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.framewrap{width:100%;background:#fff}.frame{display:block;width:100%;border:0;background:#fff;min-height:calc(100vh - 54px)}.loading,.error{margin:22px auto;max-width:720px;background:#fff;border:1px solid #cbd5e1;border-radius:12px;padding:28px 18px;text-align:center}.loading{color:#64748b}.error strong{display:block;margin-bottom:7px}.error span{font-size:12px;color:#64748b}.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0f172a;color:#fff;border-radius:9px;padding:8px 12px;font-size:11px;opacity:0;pointer-events:none;transition:.2s;z-index:99}.toast.show{opacity:1}@media(max-width:600px){.bar{padding:8px}.title{font-size:11px}.sub{font-size:9px}.reload{display:none}}
</style>
</head>
<body>
<div class="bar"><a class="back" href="index.html">← 목록</a><div class="meta"><div class="title" id="title">기획 시황 불러오는 중...</div><div class="sub" id="sub">Google Sheet DB</div></div><button class="reload" id="reload">새로고침</button></div>
<div id="host"><div class="loading">기획 시황을 불러오는 중입니다...</div></div><div class="toast" id="toast"></div>
<script>
const GAS_URL='https://script.google.com/macros/s/AKfycbxTrZ5IeWl8LkIvtfPYwFRmmsGGU4_WHw3p0O4NDT-AVwQKi0Zi5ckzWoRbXUlBzXJf/exec';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function id(){return new URLSearchParams(location.search).get('id')||''}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
function fitFrame(frame){try{const d=frame.contentDocument;if(!d)return;const set=()=>{try{const h=Math.max(d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0,innerHeight-54);frame.style.height=h+'px'}catch(e){}};set();setTimeout(set,100);setTimeout(set,500);setTimeout(set,1200);if(window.ResizeObserver&&d.body){const ro=new ResizeObserver(set);ro.observe(d.body);frame._ro=ro}}catch(e){}}
function handleWidgetMessage(ev){const m=ev.data||{};if(m.__widget==='download-file'&&m.dataUrl){try{const a=document.createElement('a');a.href=m.dataUrl;a.download=m.filename||'report.png';document.body.appendChild(a);a.click();a.remove()}catch(e){toast('다운로드를 시작하지 못했습니다.')}}else if(m.__widget==='copy-image'&&m.dataUrl){if(!navigator.clipboard||typeof ClipboardItem==='undefined'){toast('이 환경에서는 이미지 복사를 지원하지 않습니다.');return}fetch(m.dataUrl).then(r=>r.blob()).then(b=>navigator.clipboard.write([new ClipboardItem({[b.type||'image/png']:b})])).then(()=>toast('이미지를 복사했습니다.')).catch(()=>toast('이미지 복사에 실패했습니다.'))}}
window.addEventListener('message',handleWidgetMessage);
async function load(){const rid=id();if(!rid){$('host').innerHTML='<div class="error"><strong>리포트 ID가 없습니다.</strong><span>목록에서 기획 시황을 다시 선택해 주세요.</span></div>';return}try{const res=await fetch(GAS_URL+'?action=getSpecialReport&id='+encodeURIComponent(rid)+'&_='+Date.now(),{cache:'no-store',redirect:'follow'});if(!res.ok)throw new Error('HTTP '+res.status);const p=await res.json();if(!p.ok)throw new Error(p.error||'API error');if(!p.found||!p.html)throw new Error('저장된 기획 시황을 찾지 못했습니다.');const meta=p.meta||{};$('title').textContent=meta.title||'기획 시황';$('sub').textContent=[meta.date,meta.fileName].filter(Boolean).join(' · ');document.title=(meta.title||'기획 시황')+' | PlattsAI';const f=document.createElement('iframe');f.className='frame';f.setAttribute('allow','clipboard-read; clipboard-write; fullscreen');f.srcdoc=p.html;$('host').innerHTML='';$('host').appendChild(f);f.addEventListener('load',()=>fitFrame(f))}catch(e){$('title').textContent='기획 시황 로드 실패';$('host').innerHTML='<div class="error"><strong>리포트를 불러오지 못했습니다.</strong><span>'+esc(e.message||e)+'</span></div>'}}
$('reload').addEventListener('click',()=>location.reload());load();
</script>
</body></html>
