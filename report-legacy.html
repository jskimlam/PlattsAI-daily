<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Platts Daily Report</title>
<style>
:root{--up:#dc2626;--dn:#2563eb;--flat:#64748b;--nav:#0f2748;--line:#e2e8f0;--bg:#f1f5f9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#0f172a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,a{font:inherit}
header{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;padding:18px 20px}.hd{max-width:980px;margin:auto;display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.title{font-size:clamp(16px,2.2vw,21px);font-weight:850}.sub{font-size:11px;color:#cbd5e1;line-height:1.55;margin-top:5px}.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.btn,.lang{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;padding:6px 10px;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer;text-decoration:none}.lang.active{background:#fff;color:#1e3a5f}.status{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.3);padding:6px 9px;border-radius:7px;font-size:10px;color:#cbd5e1}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:#f59e0b}.status.ok:before{background:#22c55e}.status.err:before{background:#ef4444}
main{max-width:980px;margin:auto;padding:16px 12px 32px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:13px;box-shadow:0 1px 3px rgba(0,0,0,.05)}.st{display:flex;gap:7px;align-items:center;font-size:13px;font-weight:800;margin-bottom:11px}.badge{font-size:9px;padding:2px 7px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;color:#64748b}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px;margin-bottom:12px}.kpi{border:1px solid var(--line);border-radius:8px;padding:8px 10px}.kn{font-size:9.5px;color:#64748b;font-weight:700}.kv{font-size:15px;font-weight:850;margin-top:2px}.kd{font-size:10px;font-weight:700;margin-top:2px}.up{color:var(--up)}.dn{color:var(--dn)}.flat{color:var(--flat)}.tbl{overflow:auto;border:1px solid var(--line);border-radius:8px}.tbl table{border-collapse:collapse;width:100%;font-size:11px}.tbl th{background:#f8fafc;color:#64748b;font-size:9.5px;text-align:left;padding:7px;white-space:nowrap}.tbl td{padding:7px;border-top:1px solid #f1f5f9;white-space:nowrap}.comments{margin-top:12px}.comm{border-left:3px solid #cbd5e1;background:#fafafa;padding:8px 10px;margin:7px 0;border-radius:0 6px 6px 0}.comm b{font-size:11px}.comm p{margin:4px 0 0;font-size:11.5px;line-height:1.6;color:#475569}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px}.box{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fafafa;font-size:11.5px;line-height:1.55}.tag{display:inline-block;font-size:9px;font-weight:800;padding:2px 7px;border-radius:12px;background:#e2e8f0;color:#475569;margin-bottom:5px}.box ul{margin:3px 0 0;padding-left:16px}.box li{margin:3px 0}.info{list-style:none;padding:0;margin:0}.info li{padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:11.5px;line-height:1.5}.ai{font-size:12px;line-height:1.65;background:#f8fafc;border:1px solid var(--line);padding:11px;border-radius:8px;margin-bottom:9px}.dark{background:#0f172a;color:#e2e8f0;border-radius:8px;padding:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:11px}.row:last-child{border-bottom:0}.flags{background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;border-radius:8px;padding:9px;margin-top:9px;font-size:11px;line-height:1.55}.exec{background:#1e3a5f;color:#e2e8f0;border-radius:8px;padding:9px;margin-top:9px;font-size:11px;line-height:1.55}.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:9px}.chart{border:1px solid var(--line);border-radius:9px;padding:9px}.chart-h{display:flex;justify-content:space-between;gap:10px;font-size:11px;font-weight:800}.chart small{color:#94a3b8}.cw{height:145px;margin-top:5px}.cw canvas{width:100%;height:100%}.source{font-size:10px;color:#94a3b8;line-height:1.5}.error{text-align:center;padding:38px 18px}.error b{display:block;font-size:16px;margin-bottom:7px}.muted{font-size:12px;color:#64748b}
@media(max-width:620px){header{padding:14px 12px}.actions{width:100%}.card{padding:12px}.grid,.charts{grid-template-columns:1fr}}
@media print{.actions{display:none!important}body{background:#fff}.card{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<header><div class="hd"><div><div class="title" id="title">Platts Daily Report</div><div class="sub" id="sub"></div></div><div class="actions"><a class="btn" href="index.html">← Archive</a><span id="status" class="status">DB 조회 중</span><button class="lang" data-l="ko">한국어</button><button class="lang" data-l="en">English</button><button class="lang" data-l="ja">日本語</button><button class="lang" data-l="zh">中文</button><button class="btn" id="img">이미지 저장</button><button class="btn" onclick="window.print()">PDF 저장</button></div></div></header>
<main id="main"><div class="card"><div class="muted">리포트를 불러오는 중...</div></div></main>
<script>
(function(){
const GAS_URL='https://script.google.com/macros/s/AKfycbxTrZ5IeWl8LkIvtfPYwFRmmsGGU4_WHw3p0O4NDT-AVwQKi0Zi5ckzWoRbXUlBzXJf/exec';
let DATA=null,lang='ko';
const $=id=>document.getElementById(id), A=v=>Array.isArray(v)?v:[], S=(v,d='')=>v==null?d:String(v), E=s=>S(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function date(){const d=new URLSearchParams(location.search).get('date');return /^\d{4}-\d{2}-\d{2}$/.test(d||'')?d:'2026-09-11'}
function L(){if(!DATA||!DATA.T)return{};return DATA.T[lang]||DATA.T.ko||DATA.T[Object.keys(DATA.T)[0]]||{}}
function name(p,l){return S((l.names||{})[p.key],p.key)}
function stats(k){const q=(DATA.chartData||{})[k]||{},v=A(q.vals).map(Number).filter(Number.isFinite),n=v.length;if(!n)return{val:0,prev:0,d:0,p:0,c:'flat',a:'—'};const val=v[n-1],prev=n>1?v[n-2]:val,d=val-prev,p=prev?d/prev*100:0;return{val,prev,d,p,c:d>0?'up':d<0?'dn':'flat',a:d>0?'▲':d<0?'▼':'—'}}
function num(v){return Number(v).toLocaleString('en-US',{maximumFractionDigits:2})}
function section(n,t,b,body){return `<section class="card"><div class="st">${n}. ${E(t)}${b?`<span class="badge">${E(b)}</span>`:''}</div>${body}</section>`}
function render(){const l=L(),P=A(DATA.products),bad=A(l.badges);document.documentElement.lang=lang;$('title').textContent=S(l.title,'Platts Daily Report');$('sub').innerHTML=E(S(l.sub1))+(l.sub2?'<br>'+E(l.sub2):'');document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.l===lang));
let k=`<div class="kpis">`+P.map(p=>{const s=stats(p.key);return `<div class="kpi" style="border-left:3px solid ${E(p.color||'#64748b')}"><div class="kn">${E(name(p,l))}</div><div class="kv">$${num(s.val)}</div><div class="kd ${s.c}">${s.a} ${s.d>=0?'+':''}${num(s.d)} (${s.p>=0?'+':''}${s.p.toFixed(2)}%)</div></div>`}).join('')+'</div>';
const h=A(l.tbl_headers);k+=`<div class="tbl"><table><thead><tr>${(h.length?h:['상품','심볼','종가/결제가','단위','변동폭','등락률','방향','비교기준']).map(x=>`<th>${E(x)}</th>`).join('')}</tr></thead><tbody>`+P.map(p=>{const s=stats(p.key),basis=(l.basis||{})[p.freq]||'';return `<tr><td><b>${E(name(p,l))}</b></td><td>${E(p.sym)}</td><td>${num(s.val)}</td><td>USD/${E(p.unit)}</td><td class="${s.c}">${s.d>=0?'+':''}${num(s.d)}</td><td class="${s.c}">${s.p>=0?'+':''}${s.p.toFixed(2)}%</td><td class="${s.c}">${s.a}</td><td>${E(basis)}</td></tr>`}).join('')+'</tbody></table></div>';
const pc=l.product_commentary||{};k+='<div class="comments">'+P.map(p=>pc[p.key]?`<div class="comm" style="border-left-color:${E(p.color||'#64748b')}"><b>${E((p.icon||'')+' '+name(p,l)+' ('+p.sym+')')}</b><p>${E(pc[p.key])}</p></div>`:'').join('')+'</div>';let out=section(1,S(l.s1,'당일 종가/결제가 현황'),bad[0],k);
const fl=A(l.factors);out+=section(2,S(l.s2,'변동요인'),bad[1],`<div class="grid">${fl.map(f=>`<div class="box"><span class="tag">${E((l.factor_tag_labels||{})[f.tag]||f.tag)}</span><ul>${A(f.items).map(i=>`<li>${E(i.text)}${i.src?` <small>(${E(i.src)})</small>`:''}</li>`).join('')}</ul></div>`).join('')||'<div class="muted">데이터 없음</div>'}</div>`);
const oo=l.outlooks||{};out+=section(3,S(l.s3,'단기전망'),bad[2],`<div class="grid">${P.map(p=>{const o=oo[p.key];if(!o)return'';const c=o.icon==='▲'?'up':o.icon==='▼'?'dn':'flat';return `<div class="box"><b style="color:${E(p.color||'#334155')}"><span class="${c}">${E(o.icon||'—')}</span> ${E(name(p,l))}</b><ul>${A(o.pts).map(x=>`<li>${E(x)}</li>`).join('')}</ul></div>`}).join('')||'<div class="muted">데이터 없음</div>'}</div>`);
const infos=A(l.infos);out+=section(4,S(l.s4,'추가정보'),bad[3],`<ul class="info">${infos.map(i=>`<li><b>${E((l.info_tag_labels||{})[i.tag]||i.tag||'Info')}</b> · ${E(i.text)}${i.src?` <small>(${E(i.src)})</small>`:''}</li>`).join('')||'<li class="muted">데이터 없음</li>'}</ul>`);
let ai=`<div class="ai"><b>${E(S(l.ai_narrative_lbl,'AI 전망'))}</b><br>${S(l.ai_narrative,'')}</div>`;const sig=A(l.signals);if(sig.length)ai+=`<div class="dark"><b>${E(S(l.signal_lbl,'Signal'))}</b>${sig.map(x=>`<div class="row"><span>${E(x.label)}</span><span>${E(x.val)}</span></div>`).join('')}</div>`;const fg=A(l.flags);if(fg.length)ai+=`<div class="flags"><b>${E(S(l.flag_lbl,'Flags'))}</b><br>${fg.map(E).join('<br>')}</div>`;const ex=A(l.exec_rows);if(ex.length)ai+=`<div class="exec"><b>${E(S(l.exec_lbl,'Executive'))}</b><br>${ex.map(x=>`${E(x.num)}. ${E(x.label)} ${E(x.text)}`).join('<br>')}</div>`;out+=section(5,S(l.s5,'AI 전망'),bad[4],ai);
out+=section(6,S(l.s6,'가격 차트'),bad[5],`<div class="charts">${P.map(p=>`<div class="chart"><div class="chart-h"><span style="color:${E(p.color||'#334155')}">${E(name(p,l))}</span><small>${E(p.sym)} · USD/${E(p.unit)}</small></div><div class="cw"><canvas id="c-${E(p.key)}"></canvas></div></div>`).join('')}</div>`);const src=A(l.source_bar).length?A(l.source_bar):l.source_bar?[l.source_bar]:[];if(src.length)out+=`<div class="source">${src.map(E).join('<br>')}</div>`;$('main').innerHTML=out;setTimeout(()=>P.forEach(p=>draw(p)),20)}
function draw(p){const c=$('c-'+p.key);if(!c)return;const q=(DATA.chartData||{})[p.key]||{},ds=A(q.dates),vs=A(q.vals).map(Number).filter(Number.isFinite);if(!vs.length)return;const w=c.parentNode.clientWidth||260,h=c.parentNode.clientHeight||145,dpr=devicePixelRatio||1;c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);let mn=Math.min(...vs),mx=Math.max(...vs),pad=(mx-mn)*.18||Math.max(Math.abs(mn)*.02,1);mn-=pad;mx+=pad;const L=40,R=8,T=8,B=20,pw=w-L-R,ph=h-T-B,X=i=>L+(vs.length<=1?pw/2:i/(vs.length-1)*pw),Y=v=>T+(1-(v-mn)/(mx-mn))*ph;x.strokeStyle='#e2e8f0';x.lineWidth=1;for(let i=0;i<4;i++){const y=T+i/3*ph;x.beginPath();x.moveTo(L,y);x.lineTo(w-R,y);x.stroke();x.fillStyle='#94a3b8';x.font='8px sans-serif';x.textAlign='right';x.fillText(num(mx-i/3*(mx-mn)),L-4,y+3)}x.beginPath();x.strokeStyle=p.color||'#1e40af';x.lineWidth=2;vs.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.stroke();vs.forEach((v,i)=>{x.beginPath();x.arc(X(i),Y(v),2.5,0,Math.PI*2);x.fillStyle=p.color||'#1e40af';x.fill()});x.fillStyle='#94a3b8';x.font='8px sans-serif';x.textAlign='center';ds.forEach((d,i)=>{if(i<vs.length){const z=S(d).split('-');x.fillText(z.length>2?(+z[1])+'/'+(+z[2]):S(d),X(i),h-5)}})}
async function load(){const d=date(),st=$('status');st.textContent='DB '+d+' 조회 중';try{const r=await fetch(GAS_URL+'?action=getDailyReport&date='+encodeURIComponent(d)+'&_='+Date.now(),{cache:'no-store',redirect:'follow'});if(!r.ok)throw Error('HTTP '+r.status);const p=await r.json();if(!p||!p.ok||!p.found||!p.data)throw Error((p&&p.error)||'해당 날짜의 저장된 리포트가 없습니다.');DATA=p.data;if(!A(DATA.products).length||!DATA.chartData||!DATA.T)throw Error('리포트 DATA 형식이 올바르지 않습니다.');st.textContent='DB 동기화 · '+d;st.className='status ok';if(!DATA.T[lang])lang=DATA.T.ko?'ko':Object.keys(DATA.T)[0];render()}catch(e){st.textContent='DB 조회 실패';st.className='status err';$('main').innerHTML=`<div class="card error"><b>리포트를 불러오지 못했습니다.</b><div class="muted">${E(e.message||e)}</div></div>`}}
document.addEventListener('click',e=>{const b=e.target.closest('.lang');if(b&&DATA){lang=b.dataset.l;render()}});$('img').addEventListener('click',()=>{const cs=[...document.querySelectorAll('canvas')];if(!cs.length)return;const gap=8,w=Math.max(...cs.map(c=>c.width)),h=cs.reduce((a,c)=>a+c.height+gap,0)-gap,m=document.createElement('canvas');m.width=w;m.height=Math.max(1,h);const x=m.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,m.height);let y=0;cs.forEach(c=>{x.drawImage(c,0,y);y+=c.height+gap});const a=document.createElement('a');a.href=m.toDataURL('image/png');a.download='daily_report_charts_'+date()+'.png';a.click()});addEventListener('resize',()=>{if(DATA)A(DATA.products).forEach(draw)});load();
})();
</script>
</body>
</html>
