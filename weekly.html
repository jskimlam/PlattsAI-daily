<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PlattsAI Weekly</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;color:#0f172a}.bar{position:sticky;top:0;z-index:100;display:flex;gap:8px;align-items:center;padding:8px 10px;background:#0f172a;color:#fff}.bar a,.bar button{background:#1e293b;border:1px solid #64748b;border-radius:7px;padding:7px 9px;color:#fff;text-decoration:none;font:700 12px sans-serif;cursor:pointer}.meta{min-width:0;flex:1}.title{font-size:12px;font-weight:800}.status{font-size:10px;color:#cbd5e1;margin-top:3px;overflow-wrap:anywhere}.notice{padding:10px 13px;background:#fff7ed;color:#7c2d12;border-bottom:1px solid #fed7aa;font-size:12px;line-height:1.55}.frame{display:block;width:100%;border:0;background:#fff;min-height:calc(100vh - 52px)}.msg{margin:20px auto;max-width:820px;padding:20px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;font-size:13px;text-align:center}@media print{.bar,.notice{display:none!important}body{background:#fff}}
</style></head><body><div class="bar"><a href="index.html">← 목록</a><div class="meta"><div class="title" id="title">PlattsAI 위클리</div><div class="status" id="status">원본 HTML 확인 중…</div></div><button id="print">인쇄</button><button id="reload">↻</button></div><div id="notice"></div><div id="host"><div class="msg">리포트를 불러오는 중입니다…</div></div><script>
(function(){'use strict';const GAS='https://script.google.com/macros/s/AKfycbyEXfi4Hsi6kl5BJOINMtBUkzdgC3Zec4f5TsueP7NPhUjG8H78QRy3O7RlLHz0plJD/exec',p=new URLSearchParams(location.search),id=p.get('id')||'',el=x=>document.getElementById(x);let frame=null;function msg(t){el('host').innerHTML='';const div=document.createElement('div');div.className='msg';div.textContent=t;el('host').appendChild(div)}function note(t){el('notice').innerHTML='';if(!t)return;const div=document.createElement('div');div.className='notice';div.textContent=t;el('notice').appendChild(div)}async function load(){if(!/^W-\d{8}$/.test(id)){msg('위클리 Report ID 형식이 올바르지 않습니다. 목록에서 다시 선택해 주세요.');return}try{const r=await fetch(GAS+'?action=getSpecialReport&id='+encodeURIComponent(id)+'&_='+Date.now(),{cache:'no-store',redirect:'follow'});if(!r.ok)throw Error('HTTP '+r.status);const x=await r.json();if(!x.ok)throw Error(x.error||'GAS API 오류');if(!x.found||!x.html){msg('등록된 위클리 원본 HTML이 없습니다. 관리자 업로드를 확인해 주세요.');return}if(x.meta&&x.meta.reportType!=='weekly')throw Error('요청한 ID가 위클리 유형이 아닙니다.');el('title').textContent=(x.meta&&x.meta.title)||'위클리 시황';el('status').textContent=(x.meta&&x.meta.date||'')+' · 원본 HTML '+x.html.length.toLocaleString()+'자';const f=document.createElement('iframe');f.className='frame';f.title='위클리 원본 리포트';f.setAttribute('allow','clipboard-read; clipboard-write; fullscreen');frame=f;el('host').replaceChildren(f);f.srcdoc=x.html;f.addEventListener('load',()=>{try{const d=f.contentDocument,resize=()=>{f.style.height=Math.max(window.innerHeight-52,d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0)+'px'};resize();[150,600,1400].forEach(n=>setTimeout(resize,n));if(window.ResizeObserver&&d.body)new ResizeObserver(resize).observe(d.body)}catch(e){}})}catch(e){msg('위클리 HTML 조회 실패: '+e.message);note('새 GAS 배포 버전과 위클리 업로드 상태를 확인해 주세요.')}}el('print').onclick=()=>{try{frame&&frame.contentWindow?frame.contentWindow.print():window.print()}catch(e){note('APK에서 인쇄를 지원하지 않는 경우 외부 브라우저에서 열어 인쇄해 주세요.')}};el('reload').onclick=()=>location.reload();window.addEventListener('message',e=>{if(!frame||e.source!==frame.contentWindow)return;const m=e.data||{};if(m.__widget==='download-file'&&typeof m.dataUrl==='string'&&/^data:image\/png;base64,/.test(m.dataUrl)){const a=document.createElement('a');a.href=m.dataUrl;a.download=String(m.filename||'chart.png').replace(/[\\/:*?"<>|]/g,'_');a.click()}if(m.__widget==='copy-image'&&typeof m.dataUrl==='string'&&/^data:image\/png;base64,/.test(m.dataUrl)&&navigator.clipboard&&typeof ClipboardItem!=='undefined'){fetch(m.dataUrl).then(r=>r.blob()).then(b=>navigator.clipboard.write([new ClipboardItem({'image/png':b})])).catch(()=>note('이미지 복사가 지원되지 않습니다.'))}});load()})();
</script></body></html>
