<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PlattsAI Daily</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f1f5f9;color:#0f172a}.bar{position:sticky;top:0;z-index:100;display:flex;gap:8px;align-items:center;padding:8px 10px;background:#0f172a;color:#fff}.bar a,.bar button{background:#1e293b;border:1px solid #64748b;border-radius:7px;padding:7px 9px;color:#fff;text-decoration:none;font:700 12px sans-serif;cursor:pointer}.meta{min-width:0;flex:1}.title{font-size:12px;font-weight:800}.status{font-size:10px;color:#cbd5e1;margin-top:3px;overflow-wrap:anywhere}.notice{padding:10px 13px;background:#fff7ed;color:#7c2d12;border-bottom:1px solid #fed7aa;font-size:12px;line-height:1.55}.notice a{color:#1e40af;font-weight:700}.frame{display:block;width:100%;border:0;background:#fff;min-height:calc(100vh - 52px)}.msg{margin:20px auto;max-width:820px;padding:20px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;font-size:13px;text-align:center}@media print{.bar,.notice{display:none!important}body{background:#fff}}</style></head><body><div class="bar"><a href="index.html">← 목록</a><div class="meta"><div class="title" id="title">PlattsAI 데일리</div><div class="status" id="status">원본 HTML 확인 중…</div></div><button id="print">인쇄</button><button id="reload">↻</button></div><div id="notice"></div><div id="host"><div class="msg">리포트를 불러오는 중입니다…</div></div><script>
(function(){'use strict';const GAS='https://script.google.com/macros/s/AKfycbxxeodXaAL0SkWFJRZ8yoZw2pub7AckUL4KL3kPxsJk_5pxN7aVU6QNH2eKgVL-ZAC8/exec',date=new URLSearchParams(location.search).get('date')||'',el=id=>document.getElementById(id);let frame=null;function msg(t){el('host').innerHTML='';const p=document.createElement('div');p.className='msg';p.textContent=t;el('host').appendChild(p)}function notice(t){el('notice').innerHTML='';if(t){const p=document.createElement('div');p.className='notice';p.textContent=t;el('notice').appendChild(p)}}async function api(action){const r=await fetch(GAS+'?action='+action+'&date='+encodeURIComponent(date)+'&_='+Date.now(),{cache:'no-store',redirect:'follow'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!j.ok)throw Error(j.error||'GAS API 오류');return j}function attach(src,html){const f=document.createElement('iframe');f.className='frame';f.title='데일리 시황 원본';f.setAttribute('allow','clipboard-read; clipboard-write; fullscreen');frame=f;el('host').replaceChildren(f);if(html){f.srcdoc=src}else{f.src=src}f.addEventListener('load',()=>{try{const d=f.contentDocument;const update=()=>{try{f.style.height=Math.max(window.innerHeight-52,d.documentElement.scrollHeight,d.body?d.body.scrollHeight:0)+'px'}catch(e){}};update();[200,700,1600].forEach(n=>setTimeout(update,n));if(window.ResizeObserver&&d.body){const obs=new ResizeObserver(update);obs.observe(d.body)}}catch(e){}})}async function legacy(){notice('이 날짜는 DB에 원본 HTML이 없어 이전 데이터로 그래프형 화면을 복원합니다. 최초 업로드 HTML의 추가 섹션·인쇄 설정을 되살리려면 관리자에서 원본을 다시 업로드해야 합니다.');el('status').textContent=date+' · 원본 미저장 · 이전 그래프형 뷰어';try{const r=await fetch('report-legacy.html?_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('기존 뷰어 HTTP '+r.status);let html=await r.text();html=html.replace(/https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec/g,GAS);attach(html,true)}catch(e){msg('기존 뷰어를 불러오지 못했습니다: '+e.message)}}async function load(){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){msg('날짜가 올바르지 않습니다. 목록에서 날짜를 선택해 주세요.');return}el('title').textContent='데일리 시황 · '+date;try{const x=await api('getDailyReportHtml');if(x.found&&typeof x.html==='string'&&x.html.trim()){if(!/<(?:!doctype\s+html|html|head|body)\b/i.test(x.html)){notice('DB의 원본 내용이 HTML 문서 형식인지 확인이 필요합니다.')}else{notice('')}el('status').textContent=date+' · 원본 HTML '+x.html.length.toLocaleString()+'자 저장 확인';attach(x.html,true)}else{await legacy()}}catch(e){el('status').textContent='원본 조회 실패: '+e.message;msg('원본 HTML API 확인 필요: '+e.message);notice('원본 HTML 저장 상태와 GAS 배포 버전을 확인해 주세요.')}}el('print').onclick=()=>{try{frame&&frame.contentWindow?frame.contentWindow.print():window.print()}catch(e){notice('앱 내 인쇄가 지원되지 않으면 휴대전화의 브라우저에서 열어 인쇄해 주세요.')}};el('reload').onclick=()=>location.reload();window.addEventListener('message',e=>{if(!frame||e.source!==frame.contentWindow)return;const m=e.data||{};if(m.__widget==='download-file'&&typeof m.dataUrl==='string'&&/^data:image\/png;base64,/.test(m.dataUrl)){const a=document.createElement('a');a.href=m.dataUrl;a.download=String(m.filename||'chart.png').replace(/[\\/:*?"<>|]/g,'_');a.click()}});load()})();
</script></body></html>
