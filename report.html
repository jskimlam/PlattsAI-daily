<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PlattsAI Daily Report</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f5f9;color:#0f172a}.bar{position:sticky;top:0;z-index:99;display:flex;gap:9px;align-items:center;background:#0f172a;color:#fff;padding:8px 13px}.back,.action{border:1px solid #64748b;background:#1e293b;color:#fff;border-radius:7px;padding:8px 11px;font-size:12px;font-weight:700;text-decoration:none;cursor:pointer}.meta{min-width:0;flex:1}.heading{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:10px;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.frame{display:block;width:100%;border:0;background:#fff;min-height:calc(100vh - 51px)}.message{max-width:850px;margin:18px auto;padding:23px;background:#fff;border:1px solid #cbd5e1;border-radius:10px;text-align:center;font-size:13px}.old{max-width:980px;margin:12px auto;padding:0 12px 24px}.card{background:white;border:1px solid #e2e8f0;border-radius:9px;padding:14px;margin:9px 0;line-height:1.65;font-size:13px}.card h2{font-size:15px;margin:0 0 9px}.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}.pitem{border:1px solid #e2e8f0;border-radius:7px;padding:9px}.pitem strong{display:block;font-size:16px}.muted{color:#64748b;font-size:11px}.factors{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px}.factors>div{border:1px solid #e2e8f0;padding:9px;border-radius:7px}.old ul{margin:5px 0;padding-left:20px}.old li{margin:4px 0}.up{color:#dc2626}.dn{color:#2563eb}.source{color:#64748b;font-size:11px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:9px 13px;border-radius:8px;z-index:200;font-size:11px;display:none}@media(max-width:600px){.bar{padding:7px}.action{padding:7px 8px;font-size:11px}.heading{font-size:11px}.sub{font-size:9px}}@media print{.bar,.toast{display:none!important}body{background:white}.card{break-inside:avoid}.old{max-width:none}.message{display:none}}
</style></head><body>
<div class="bar"><a class="back" href="index.html">← 목록</a><div class="meta"><div class="heading" id="title">데일리 시황</div><div class="sub" id="sub">원본 HTML 조회 중…</div></div><button class="action" id="pdf">PDF / 인쇄</button><button class="action" id="reload">↻</button></div>
<div id="host"><div class="message">리포트를 불러오는 중입니다…</div></div><div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const GAS_URL='https://script.google.com/macros/s/AKfycbygIHKgqSHk9WdaYK3TG2BO_p0S2PwZgByUdDFrcDdTkVOQ9NQPhC8saF4pj1ENAH6H/exec';
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date=new URLSearchParams(location.search).get('date')||'';let frame=null;
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
function message(s){$('host').innerHTML='<div class="message">'+esc(s)+'</div>'}
async function api(action){const r=await fetch(GAS_URL+'?action='+action+'&date='+encodeURIComponent(date)+'&_='+Date.now(),{cache:'no-store',redirect:'follow'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!j.ok)throw Error(j.error||'API 오류');return j}
function fit(f){try{let d=f.contentDocument;if(!d)return;const update=()=>{try{f.style.height=Math.max(innerHeight-51,d.documentElement.scrollHeight,d.body?.scrollHeight||0)+'px'}catch(e){}};update();[100,400,1200,2500].forEach(ms=>setTimeout(update,ms));if(window.ResizeObserver&&d.body){let obs=new ResizeObserver(update);obs.observe(d.body);f._resizeObserver=obs}}catch(e){f.style.height='calc(100vh - 51px)'}}
function showOriginal(html){const f=document.createElement('iframe');f.className='frame';f.title='데일리 원본 리포트';f.setAttribute('allow','clipboard-read; clipboard-write; fullscreen');f.srcdoc=html;frame=f;$('host').replaceChildren(f);f.addEventListener('load',()=>{fit(f);$('sub').textContent=date+' · 원본 HTML · 모든 섹션 및 인쇄 설정 보존'});$('title').textContent='데일리 시황 · '+date;document.title='PlattsAI '+date}
function legacy(j){const D=j.data||{},P=Array.isArray(D.products)?D.products:[],L=D.T?.ko||Object.values(D.T||{})[0]||{};const A=v=>Array.isArray(v)?v:[],N=p=>L.names?.[p.key]||p.name||p.key;
const sec=(name,body)=>'<section class="card"><h2>'+esc(name)+'</h2>'+body+'</section>';
let out=sec('가격', '<div class="pgrid">'+P.map(p=>{let v=A(D.chartData?.[p.key]?.vals).map(Number).filter(Number.isFinite);let val=v.at(-1),prev=v.at(-2)??val,delta=val-prev,cl=delta>0?'up':delta<0?'dn':'';return '<div class="pitem"><div>'+esc(N(p))+'</div><strong>'+esc(val==null?'—':val.toLocaleString('en-US',{maximumFractionDigits:3}))+'</strong><div class="muted">'+esc(p.sym||'')+' · '+esc(p.unit||'')+'</div><div class="'+cl+'">'+(delta>0?'▲ +':delta<0?'▼ ':'— ')+esc(Number.isFinite(delta)?delta.toFixed(2):'—')+'</div></div>'}).join('')+'</div>');
if(L.summary)out+=sec('전체 요약','<p>'+esc(L.summary)+'</p>');const pc=L.product_commentary||{};if(Object.keys(pc).length)out+=sec('제품별 코멘터리',P.map(p=>pc[p.key]?'<p><b>'+esc(N(p))+'</b><br>'+esc(pc[p.key])+'</p>':'').join(''));
if(A(L.factors).length)out+=sec('변동요인','<div class="factors">'+A(L.factors).map(f=>'<div><b>'+esc(L.factor_tag_labels?.[f.tag]||f.tag)+'</b><ul>'+A(f.items).map(x=>'<li>'+esc(x.text||x)+'</li>').join('')+'</ul></div>').join('')+'</div>');
let outlook=L.outlooks||{};if(Object.keys(outlook).length)out+=sec('단기전망','<div class="factors">'+P.map(p=>{let o=outlook[p.key];return o?'<div><b>'+esc(o.icon||'')+' '+esc(N(p))+'</b><ul>'+A(o.pts).map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul></div>':''}).join('')+'</div>');
if(A(L.infos).length)out+=sec('추가정보','<ul>'+A(L.infos).map(x=>'<li><b>'+esc(L.info_tag_labels?.[x.tag]||x.tag||'')+'</b> '+esc(x.text||'')+'</li>').join('')+'</ul>');
if(L.ai_narrative||A(L.signals).length||A(L.flags).length)out+=sec('AI 전망','<p>'+esc(L.ai_narrative||'')+'</p><ul>'+A(L.signals).map(s=>'<li>'+esc(s.label||'')+': '+esc(s.val||'')+'</li>').join('')+A(L.flags).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>');
if(A(L.exec_rows).length)out+=sec('경영진 요약','<ol>'+A(L.exec_rows).map(x=>'<li>'+esc(x.text||'')+'</li>').join('')+'</ol>');
if(L.source_bar)out+=sec('출처','<div class="source">'+esc(A(L.source_bar).length?A(L.source_bar).join(' · '):L.source_bar)+'</div>');
if(!P.length&&!out)out=sec('이전 형식 리포트','저장된 DATA가 없습니다.');$('host').innerHTML='<div class="old">'+out+'</div>';$('title').textContent=L.title||j.meta?.title||'데일리 시황';$('sub').textContent=date+' · 이전 DB 형식 (원본 HTML 미보존)';document.title=$('title').textContent}
async function load(){if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){message('날짜 형식이 올바르지 않습니다. 목록에서 선택해 주세요.');return}try{const x=await api('getDailyReportHtml');if(x.found&&typeof x.html==='string'&&x.html.trim()){showOriginal(x.html);return}const old=await api('getDailyReport');if(!old.found)throw Error('저장된 리포트를 찾지 못했습니다.');legacy(old)}catch(e){message('조회 실패: '+(e.message||e));$('sub').textContent='DB 연결 확인 필요'}}
window.addEventListener('message',e=>{if(!frame||e.source!==frame.contentWindow)return;const m=e.data||{};if(m.__widget==='download-file'&&typeof m.dataUrl==='string'&&/^data:image\/png;base64,/.test(m.dataUrl)){const a=document.createElement('a');a.href=m.dataUrl;a.download=String(m.filename||'chart.png').replace(/[\\/:*?"<>|]/g,'_');document.body.appendChild(a);a.click();a.remove()}if(m.__widget==='copy-image'&&typeof m.dataUrl==='string'&&/^data:image\/png;base64,/.test(m.dataUrl)){if(!navigator.clipboard||typeof ClipboardItem==='undefined'){toast('이미지 복사는 현재 환경에서 지원되지 않습니다.');return}fetch(m.dataUrl).then(r=>r.blob()).then(b=>navigator.clipboard.write([new ClipboardItem({'image/png':b})])).then(()=>toast('이미지를 복사했습니다.')).catch(()=>toast('이미지 복사 실패'))}});
$('pdf').onclick=()=>{if(frame&&frame.contentWindow){try{frame.contentWindow.focus();frame.contentWindow.print()}catch(e){toast('원본 리포트 안의 PDF 버튼을 이용해 주세요.')}}else window.print()};$('reload').onclick=()=>location.reload();load();
})();
</script></body></html>
